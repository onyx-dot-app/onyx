{{- if eq (include "onyx.logExportRbacEnabled" .) "true" }}
{{- $name := include "onyx.resourceName" (list . "log-export") }}
# Lets the api-server read pod logs, pod status, and events in this namespace
# for the admin log export (ee/onyx/server/log_export/kubernetes_collection.py).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-export
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-export
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onyx.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
