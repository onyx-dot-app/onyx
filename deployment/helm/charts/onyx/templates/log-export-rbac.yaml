{{- if eq (include "onyx.logExportKubernetesEnabled" .) "true" }}
{{- $name := include "onyx.resourceName" (list . "log-export") }}
{{- $serviceAccountName := include "onyx.apiServerServiceAccountName" . }}
# The api-server's own identity, so only it can read pod logs, pod status, and
# events for the admin log export (ee/onyx/server/log_export/kubernetes_collection.py).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
  {{- with merge (dict) (dig "kubernetes" "serviceAccount" "annotations" (dict) .Values.logExport) (.Values.serviceAccount.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-export
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-export
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
