{{- if eq .Values.chatEngine "pi" }}
{{- if and .Values.agent.redis.enabled (not .Values.agent.redis.existingSecret) }}
{{- $name := include "onyx.resourceName" (list . "agent-redis") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: agent-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.agent.redis.image | quote }}
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - {{ .Values.agent.redis.maxMemory | quote }}
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
          livenessProbe:
            exec:
              command: [redis-cli, ping]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.agent.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if ne .Values.agent.redis.storageClassName nil }}
        storageClassName: {{ .Values.agent.redis.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.agent.redis.storageSize }}
{{- end }}

{{- end }}
