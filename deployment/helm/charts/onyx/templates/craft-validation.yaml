{{- $craftEnabled := eq (include "onyx.craftEnabled" .) "true" }}
{{- if $craftEnabled }}
{{- if ne (toString (index .Values.configMap "CRAFT_SANDBOX_RUNTIME" | default "kubernetes_firecracker")) "kubernetes_firecracker" }}
{{- fail "configMap.CRAFT_SANDBOX_RUNTIME must be kubernetes_firecracker when configMap.ENABLE_CRAFT is enabled" }}
{{- end }}
{{- if not (index .Values.configMap "ONYX_SERVER_URL") }}
{{- fail "configMap.ONYX_SERVER_URL must be set when configMap.ENABLE_CRAFT is enabled" }}
{{- end }}
{{- if ne ((.Values.sandboxPod | default dict).runtimeClassName | default "kata-fc") "kata-fc" }}
{{- fail "sandboxPod.runtimeClassName must be kata-fc; Craft requires Firecracker" }}
{{- end }}
{{- $proxy := .Values.sandboxProxy | default dict }}
{{- if and (or $proxy.egressAllowIPv6 $proxy.allowGlobalClients (contains ":" ($proxy.listenHost | default "0.0.0.0"))) (empty $proxy.internalCIDRs) }}
{{- fail "sandboxProxy.internalCIDRs must include internal VPC, pod, Service, and node networks when IPv6 or global proxy clients are enabled" }}
{{- end }}
# Craft chart validation passed.
{{- else }}
# Craft chart validation skipped.
{{- end }}
