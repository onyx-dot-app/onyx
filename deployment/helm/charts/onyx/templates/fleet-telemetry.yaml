{{- define "onyx.fleetTelemetryEnv" -}}
{{- if and .Values.fleetTelemetry.enabled (ne (lower (toString .Values.configMap.DISABLE_TELEMETRY)) "true") }}
- name: ONYX_TELEMETRY_ENDPOINT
  value: {{ .Values.fleetTelemetry.endpoint | quote }}
{{- if .Values.fleetTelemetry.existingSecret }}
- name: ONYX_TELEMETRY_CUSTOMER_UUID
  value: {{ required "fleetTelemetry.customerUuid is required" .Values.fleetTelemetry.customerUuid | quote }}
- name: ONYX_TELEMETRY_DEPLOYMENT_ID
  value: {{ required "fleetTelemetry.deploymentId is required" .Values.fleetTelemetry.deploymentId | quote }}
- name: ONYX_TELEMETRY_TOKEN
  valueFrom:
    secretKeyRef:
      name: {{ required "fleetTelemetry.existingSecret is required" .Values.fleetTelemetry.existingSecret }}
      key: ONYX_TELEMETRY_TOKEN
- name: ONYX_TELEMETRY_PRIVACY_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.fleetTelemetry.existingSecret }}
      key: ONYX_TELEMETRY_PRIVACY_KEY
{{- end }}
{{- else }}
- name: DISABLE_TELEMETRY
  value: "true"
{{- end }}
{{- end }}
{{- if and .Values.fleetTelemetry.enabled .Values.fleetTelemetry.collector.enabled (ne (lower (toString .Values.configMap.DISABLE_TELEMETRY)) "true") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
  {{- with .Values.fleetTelemetry.collector.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.fleetTelemetry.collector.kubernetes }}
{{- if .Values.fleetTelemetry.collector.kubernetes }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: telemetry-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "onyx.resourceName" (list . "telemetry-collector") }}
      automountServiceAccountToken: {{ .Values.fleetTelemetry.collector.kubernetes }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          {{- if .Values.fleetTelemetry.collector.image }}
          image: {{ .Values.fleetTelemetry.collector.image | quote }}
          {{- else }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Values.global.version }}"
          {{- end }}
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          # Backend images from before the collector wait idle instead of
          # restarting, so a chart upgrade cannot get ahead of its image.
          command:
            - python
            - -c
            - |
              import importlib.util, runpy, signal, sys
              module = "onyx.utils.fleet_telemetry_collector"
              if importlib.util.find_spec(module) is None:
                  for stop in (signal.SIGINT, signal.SIGTERM):
                      signal.signal(stop, lambda *_: sys.exit(0))
                  while True:
                      signal.pause()
              runpy.run_module(module, run_name="__main__", alter_sys=True)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.fleetTelemetry.collector.resources | nindent 12 }}
          volumeMounts:
            - name: collector-tmp
              mountPath: /tmp
            {{- include "onyx.postgresTls.volumeMount" . | nindent 12 }}
            {{- include "onyx.redisTls.volumeMount" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
            {{- with .Values.extraEnvFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            {{- include "onyx.envSecrets" . | nindent 12 }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOG_LEVEL
              value: "ERROR"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            {{- if .Values.fleetTelemetry.collector.awsResources }}
            - name: AWS_REGION
              value: {{ .Values.fleetTelemetry.collector.awsRegion | quote }}
            - name: ONYX_TELEMETRY_AWS_RESOURCES_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fleetTelemetry.existingSecret }}
                  key: ONYX_TELEMETRY_AWS_RESOURCES_JSON
            {{- end }}
            {{- if .Values.fleetTelemetry.existingSecret }}
            - name: ONYX_TELEMETRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fleetTelemetry.existingSecret }}
                  key: ONYX_TELEMETRY_DATABASE_URL
            - name: ONYX_TELEMETRY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fleetTelemetry.existingSecret }}
                  key: ONYX_TELEMETRY_REDIS_URL
                  optional: true
            {{- end }}
            {{- if .Values.fleetTelemetry.collector.schemas }}
            - name: ONYX_TELEMETRY_SCHEMAS
              value: {{ .Values.fleetTelemetry.collector.schemas | quote }}
            {{- end }}
            - name: ONYX_TELEMETRY_SCHEMA_SHARD_INDEX
              value: {{ .Values.fleetTelemetry.collector.schemaShardIndex | quote }}
            - name: ONYX_TELEMETRY_SCHEMA_SHARD_COUNT
              value: {{ .Values.fleetTelemetry.collector.schemaShardCount | quote }}
            - name: ONYX_TELEMETRY_KUBERNETES
              value: {{ .Values.fleetTelemetry.collector.kubernetes | quote }}
            - name: ONYX_TELEMETRY_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: collector-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- include "onyx.postgresTls.volume" . | nindent 8 }}
        {{- include "onyx.redisTls.volume" . | nindent 8 }}
{{- end }}
