{{- if and .Values.vectorDB.enabled .Values.celery_worker_docconversion.enabled (or .Values.celery_worker_docconversion.autoscaling.enabled (gt (int .Values.celery_worker_docconversion.replicaCount) 0)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onyx.resourceName" (list . "celery-worker-docconversion") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    {{- with .Values.celery_worker_docconversion.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.celery_worker_docconversion.autoscaling.enabled }}
  replicas: {{ .Values.celery_worker_docconversion.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      {{- if .Values.celery_worker_docconversion.deploymentLabels }}
      {{- toYaml .Values.celery_worker_docconversion.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.celery_worker_docconversion.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "onyx.labels" . | nindent 8 }}
        {{- with .Values.celery_worker_docconversion.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.celery_worker_docconversion.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "onyx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.celery_shared.podSecurityContext | nindent 8 }}
      {{- with .Values.celery_worker_docconversion.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery_worker_docconversion.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery_worker_docconversion.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: celery-worker-docconversion
          securityContext:
            {{- include "onyx.containerSecurityContext" .Values.celery_shared.securityContext | nindent 12 }}
          image: "{{ .Values.celery_shared.image.repository }}:{{ .Values.celery_shared.image.tag | default .Values.global.version }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          command:
            [
              {{- with include "onyx.customCACerts.commandPrefix" . }}
              {{- . | nindent 14 }}
              {{- end }}
              "celery",
              "-A",
              "onyx.background.celery.versioned_apps.docconversion",
              "worker",
              "--pool=threads",
              {{ printf "--concurrency=%d" (int .Values.celery_worker_docconversion.concurrency) | quote }},
              "--prefetch-multiplier=1",
              {{- with .Values.celery_worker_docconversion.logLevel }}
              {{ printf "--loglevel=%s" . | quote }},
              {{- end }}
              "--hostname=docconversion@%n",
              "-Q",
              "docconversion",
            ]
          ports:
            - name: metrics
              containerPort: 9099
              protocol: TCP
          resources:
            {{- toYaml .Values.celery_worker_docconversion.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
            {{- with .Values.extraEnvFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: ENABLE_CONVERSION_STAGE
              value: "true"
            {{- include "onyx.envSecrets" . | nindent 12}}
            {{- with include "onyx.customCACerts.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.celery_worker_docconversion.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with include "onyx.volumeMountsWithCA" (dict "ctx" . "volumeMounts" .Values.celery_worker_docconversion.volumeMounts) }}
          {{- . | nindent 10 }}
          {{- end }}
          startupProbe:
            {{ .Values.celery_shared.startupProbe | toYaml | nindent 12}}
          readinessProbe:
            {{ .Values.celery_shared.readinessProbe | toYaml | nindent 12}}
            exec:
              command:
                - /bin/bash
                - -c
                - >
                    python onyx/background/celery/celery_k8s_probe.py
                    --probe readiness
                    --filename /tmp/onyx_k8s_docconversion_readiness.txt
          livenessProbe:
            {{ .Values.celery_shared.livenessProbe | toYaml | nindent 12}}
            exec:
              command:
                - /bin/bash
                - -c
                - >
                    python onyx/background/celery/celery_k8s_probe.py
                    --probe liveness
                    --filename /tmp/onyx_k8s_docconversion_liveness.txt
      {{- with include "onyx.volumesWithCA" (dict "ctx" . "volumes" .Values.celery_worker_docconversion.volumes) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
