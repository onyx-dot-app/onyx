{{/*
Pre-pulls the sandbox image onto every node in the sandbox pool so a user's
first sandbox there doesn't pay the pull. See docs/craft/sandbox/image-and-spinup.md.

This template renders NAMESPACED objects only. It deliberately no longer ships a
PriorityClass; see the docs above before adding one back.
*/}}
{{- $prepull := .Values.sandboxImagePrepull | default dict }}
{{- $res := $prepull.resources | default dict }}
{{- $cpu := $res.cpu | default "10m" }}
{{- $mem := $res.memory | default "32Mi" }}
{{- $eph := $res.ephemeralStorage | default "64Mi" }}
{{- $maxUnavailable := $prepull.updateMaxUnavailable | default "25%" }}
{{/* Floored: the kubelet backs off restarts, and the backoff counter only
resets once a container has run for ~10 minutes. A shorter interval would
stretch itself out anyway, and noisily. */}}
{{- $recheck := max (int ($prepull.recheckIntervalSeconds | default 900)) 600 }}
{{- if and (eq (include "onyx.craftEnabled" .) "true") $prepull.enabled }}
{{- $cm := .Values.configMap }}
{{- $sandboxNs := $cm.SANDBOX_NAMESPACE | default "onyx-sandboxes" }}
{{- $saName := (index $cm "SANDBOX_SERVICE_ACCOUNT_NAME") | default "sandbox" }}
{{- $image := include "onyx.sandboxImage" . }}
{{- $pullPolicy := include "onyx.sandboxImagePullPolicy" . }}
{{- $sandboxPod := .Values.sandboxPod | default dict }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "onyx.fullname" . }}-sandbox-image-prepuller
  namespace: {{ $sandboxNs }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-image-prepuller
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $maxUnavailable | quote }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-image-prepuller
  template:
    metadata:
      labels:
        {{- include "onyx.selectorLabels" . | nindent 8 }}
        {{- /* Not `component: sandbox` — that label is the selector for the
        sandbox NetworkPolicies, and this pod is not a sandbox. */}}
        app.kubernetes.io/component: sandbox-image-prepuller
        admission.datadoghq.com/enabled: "false"
    spec:
      {{- /* Same placement as the sandbox pods, or the wrong nodes get warmed. */}}
      nodeSelector:
        {{- (index $sandboxPod "nodeSelector" | default (dict "onyx.app/workload" "sandbox")) | toYaml | nindent 8 }}
      tolerations:
        {{- (index $sandboxPod "tolerations" | default (list (dict "key" "workload" "operator" "Equal" "value" "sandbox" "effect" "NoSchedule"))) | toYaml | nindent 8 }}
      {{- /* Opt-in only, and it must be a class that already exists: the chart
      creates none. Unset means the cluster default priority. */}}
      {{- with $prepull.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- /* Pull credentials come from the sandbox SA only, same as the
      PodTemplate. `.Values.imagePullSecrets` names release-namespace secrets,
      which don't resolve for a pod in the sandbox namespace. */}}
      serviceAccountName: {{ $saName }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepuller
          image: {{ $image }}
          {{- /* Always, deliberately not the shared $pullPolicy: a kubelet
          re-resolves a tag to a digest only when it starts a container, and
          this is the only thing in the deployment that ever asks the registry
          whether a mutable tag has moved. IfNotPresent here would mean no node
          ever notices new content published behind the tag. */}}
          imagePullPolicy: Always
          {{- /* Exits on purpose, so the kubelet restarts it and re-resolves
          the tag — that restart *is* the periodic image check. It still spends
          essentially all its time running, which is what keeps the kubelet
          exempting the image from GC. Plain `sleep`, not `sleep infinity` (a
          GNU coreutils extension that dies on busybox/alpine). */}}
          command: ["sh", "-c", "sleep {{ $recheck }}"]
          resources:
            requests:
              cpu: {{ $cpu | quote }}
              memory: {{ $mem | quote }}
              ephemeral-storage: {{ $eph | quote }}
            limits:
              cpu: {{ $cpu | quote }}
              memory: {{ $mem | quote }}
              ephemeral-storage: {{ $eph | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
---
{{- /* Not being `component: sandbox` also leaves this out of the sandbox
default-deny, so it carries its own. The pod needs no network — the pull is the
kubelet's. Listing a policyType with no rules is deny-all. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onyx.fullname" . }}-sandbox-image-prepuller
  namespace: {{ $sandboxNs }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-image-prepuller
spec:
  podSelector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-image-prepuller
  policyTypes: [Ingress, Egress]
{{- end }}
