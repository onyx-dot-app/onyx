{{- /* Also for Firecracker: sandbox-proxy writes its egress CA ConfigMap here. */}}
{{- if include "onyx.sandboxProxyEnabled" . }}
{{- $sandboxNs := .Values.configMap.SANDBOX_NAMESPACE | default "onyx-sandboxes" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $sandboxNs }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: {{ include "onyx.fullname" . }}
{{- end }}
