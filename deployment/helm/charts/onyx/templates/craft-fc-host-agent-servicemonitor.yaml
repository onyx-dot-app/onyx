{{- /* ServiceMonitor for the Craft Firecracker host agent metrics (ENG-4570).
Needs craft.sandboxRuntime=firecracker, craft.hostAgent.metrics.enabled and
monitoring.serviceMonitors.enabled. Same auth as the api_server
ServiceMonitor: with auth.metricsAuth, Prometheus sends the token from the
agent namespace copy (craft-fc-host-agent.yaml). */}}
{{- $agent := (.Values.craft | default dict).hostAgent | default dict }}
{{- $metrics := $agent.metrics | default dict }}
{{- if and (eq (include "onyx.craftSandboxRuntime" .) "firecracker") $metrics.enabled .Values.monitoring.serviceMonitors.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "onyx.resourceName" (list . "craft-fc-host-agent") }}
  namespace: {{ include "onyx.craftHostAgentNamespace" . }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: craft-fc-host-agent
    {{- with .Values.monitoring.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "onyx.craftHostAgentNamespace" . }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: craft-fc-host-agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # One target per node: keep the node name on every series.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      {{- if eq (include "onyx.craftHostAgentMetricsAuth" .) "token" }}
      authorization:
        credentials:
          name: {{ include "onyx.craftHostAgentMetricsSecret" . }}
          key: {{ include "onyx.craftHostAgentMetricsKey" . }}
      {{- end }}
{{- end }}
