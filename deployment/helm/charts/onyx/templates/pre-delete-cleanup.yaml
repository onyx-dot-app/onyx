{{- /*
Pre-delete hook: delete this release's operator-managed CRs while the operators
are still running so their finalizers are processed cleanly. Without this, helm
uninstall tears down the operators and CRs simultaneously — the operators
die before finishing finalizer processing, and namespace cleanup hangs.
Deletes by name so other releases' and user-managed CRs in the namespace survive.
*/}}
{{- $pgClusterName := printf "%s-pg" .Release.Name }}
{{- $redisName := .Values.redis.redisStandalone.name | default .Release.Name }}
{{- $deletePostgres := and .Values.postgresql.enabled (not .Values.postgresql.cluster.retainOnUninstall) }}
{{- $deleteRedis := .Values.redis.enabled }}
{{- $targets := list }}
{{- if $deletePostgres }}
{{- $targets = append $targets (dict "container" "delete-postgres-cluster" "resource" (printf "clusters.postgresql.cnpg.io/%s" $pgClusterName)) }}
{{- end }}
{{- if $deleteRedis }}
{{- $targets = append $targets (dict "container" "delete-redis" "resource" (printf "redis.redis.redis.opstreelabs.in/%s" $redisName)) }}
{{- end }}
{{- if $targets }}
{{- $image := .Values.preDeleteCleanup.image }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onyx.resourceName" (list . "pre-delete") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "onyx.resourceName" (list . "pre-delete") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
  {{- if $deletePostgres }}
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    resourceNames: [{{ $pgClusterName | quote }}]
    verbs: ["get", "list", "watch", "delete"]
  {{- end }}
  {{- if $deleteRedis }}
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    resourceNames: [{{ $redisName | quote }}]
    verbs: ["get", "list", "watch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "onyx.resourceName" (list . "pre-delete") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "onyx.resourceName" (list . "pre-delete") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "onyx.resourceName" (list . "pre-delete") }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "onyx.resourceName" (list . "pre-delete") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "onyx.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "onyx.resourceName" (list . "pre-delete") }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- range $targets }}
        - name: {{ .container }}
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          args:
            - delete
            - {{ .resource }}
            - --namespace={{ $.Release.Namespace }}
            - --ignore-not-found
            - --wait
            - --timeout=120s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kube-cache
              mountPath: /home/nonroot/.kube
        {{- end }}
      volumes:
        - name: kube-cache
          emptyDir: {}
{{- end }}
