{{- if eq (include "onyx.craftEnabled" .) "true" }}
{{- $sandboxNs := .Values.configMap.SANDBOX_NAMESPACE | default "onyx-sandboxes" }}
# Ingress restricted to the sandbox namespace. The proxy has no
# authentication on its port; this is the K8s-level control that keeps
# unrelated pods from connecting and getting their flows logged as
# `unidentified_egress`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onyx.resourceName" (list . "sandbox-proxy") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-proxy
spec:
  podSelector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $sandboxNs }}
        {{- if eq (include "onyx.craftSandboxRuntime" .) "firecracker" }}
        {{- /* Firecracker VM egress arrives from the host agent relay, signed
        per connection. The proxy has no separate relay port, and pod sandboxes
        can still run, so the sandbox namespace keeps its access. */}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "onyx.craftHostAgentNamespace" . }}
          podSelector:
            matchLabels:
              {{- include "onyx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: craft-fc-host-agent
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "onyx.sandboxProxyPort" . }}
{{- end }}
