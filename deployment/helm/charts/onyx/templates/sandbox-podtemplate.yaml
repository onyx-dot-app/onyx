{{- if eq (include "onyx.craftEnabled" .) "true" }}
{{/*
Static shape of the per-user sandbox Pod. The Craft sandbox manager reads this
and overlays the dynamic fields: name, sandbox/tenant labels, per-pod
opencode-auth env, allowed origins, and proxy hostAliases IP.
*/}}
{{- $cm := .Values.configMap }}
{{- $sandboxNs := $cm.SANDBOX_NAMESPACE | default "onyx-sandboxes" }}
{{- $saName := (index $cm "SANDBOX_SERVICE_ACCOUNT_NAME") | default "sandbox" }}
{{/* Shared with the image-prepull DaemonSet so the pinned ref can't drift. */}}
{{- $image := include "onyx.sandboxImage" . }}
{{- $pullPolicy := include "onyx.sandboxImagePullPolicy" . }}
{{- $cpuReq := (index $cm "SANDBOX_POD_CPU_REQUEST") | default "1000m" }}
{{- $memReq := (index $cm "SANDBOX_POD_MEMORY_REQUEST") | default "2Gi" }}
{{- $cpuLim := (index $cm "SANDBOX_POD_CPU_LIMIT") | default "2000m" }}
{{- $memLim := (index $cm "SANDBOX_POD_MEMORY_LIMIT") | default "10Gi" }}
{{/* Without a request, the scheduler ignores sandbox disk usage and the
kubelet evicts sandbox pods first under node disk pressure. */}}
{{- $ephReq := (index $cm "SANDBOX_POD_EPHEMERAL_STORAGE_REQUEST") | default "5Gi" }}
{{- $ephLim := (index $cm "SANDBOX_POD_EPHEMERAL_STORAGE_LIMIT") | default "20Gi" }}
{{- $nextjsStart := (index $cm "SANDBOX_NEXTJS_PORT_START") | default "3010" | int }}
{{- $nextjsEnd := (index $cm "SANDBOX_NEXTJS_PORT_END") | default "3100" | int }}
{{- $opencodePort := (index $cm "OPENCODE_SERVE_PORT") | default "4096" | int }}
{{- $proxyPort := include "onyx.sandboxProxyPort" . }}
{{- $proxyHost := include "onyx.sandboxProxyHost" . }}
{{- $caConfigMap := (index $cm "SANDBOX_PROXY_CA_CONFIGMAP") | default "sandbox-proxy-ca-bundle" }}
{{- $serverUrl := (index $cm "ONYX_SERVER_URL") }}
{{- $sandboxPod := .Values.sandboxPod | default dict }}
{{- $caBundleFile := "/etc/ssl/sandbox/ca-bundle.crt" }}
{{- $runtimeClassName := $sandboxPod.runtimeClassName | default "kata-fc" }}
apiVersion: v1
kind: PodTemplate
metadata:
  name: sandbox-pod
  namespace: {{ $sandboxNs }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
template:
  metadata:
    labels:
      app.kubernetes.io/component: sandbox
      app.kubernetes.io/managed-by: onyx
      onyx.app/sandbox-protocol: "2"
      admission.datadoghq.com/enabled: "false"
  spec:
    runtimeClassName: {{ $runtimeClassName | quote }}
    serviceAccountName: {{ $saName }}
    automountServiceAccountToken: false
    restartPolicy: Never
    terminationGracePeriodSeconds: 10
    enableServiceLinks: false
    shareProcessNamespace: false
    hostNetwork: false
    hostPID: false
    hostIPC: false
    nodeSelector:
      {{- (index $sandboxPod "nodeSelector" | default (dict "onyx.app/workload" "sandbox")) | toYaml | nindent 6 }}
    tolerations:
      {{- (index $sandboxPod "tolerations" | default (list (dict "key" "workload" "operator" "Equal" "value" "sandbox" "effect" "NoSchedule"))) | toYaml | nindent 6 }}
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: sandbox-firewall
        image: {{ $image }}
        imagePullPolicy: {{ $pullPolicy }}
        command: ["/bin/bash", "/opt/onyx-guest/firewall-init.sh", "firewall"]
        env:
          - { name: SANDBOX_PROXY_HOST, value: "{{ $proxyHost }}" }
          - { name: SANDBOX_PROXY_PORT, value: "{{ $proxyPort }}" }
        resources:
          requests: { cpu: "50m", memory: "32Mi" }
          limits: { cpu: "500m", memory: "128Mi" }
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          privileged: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
    containers:
      - name: sandbox
        image: {{ $image }}
        imagePullPolicy: {{ $pullPolicy }}
        ports:
          - { name: opencode, containerPort: {{ $opencodePort }} }
          {{- range $p := untilStep $nextjsStart $nextjsEnd 1 }}
          - { name: "nextjs-{{ $p }}", containerPort: {{ $p }} }
          {{- end }}
        env:
          - { name: SANDBOX_LISTEN_HOST, value: {{ $sandboxPod.listenHost | default "0.0.0.0" | quote }} }
          - { name: SANDBOX_PROXY_HOST, value: "{{ $proxyHost }}" }
          - { name: SANDBOX_PROXY_PORT, value: "{{ $proxyPort }}" }
          - { name: ONYX_PAT, value: "replaced_by_egress_proxy" }
          - { name: ONYX_SERVER_URL, value: "{{ $serverUrl }}" }
          {{/* The deployment value is the exact API base; do not append the CLI default. */}}
          - { name: ONYX_API_PREFIX, value: "" }
          - { name: GH_TOKEN, value: "replaced_by_egress_proxy" }
          - { name: GH_NO_UPDATE_NOTIFIER, value: "1" }
          - { name: OPENCODE_DATA_HOME, value: "/workspace/opencode-data" }
          - { name: SANDBOX_PROXY_CA_BUNDLE_SRC, value: "/sandbox-ca/ca.crt" }
          - { name: SANDBOX_PROXY_CA_BUNDLE_DST, value: "{{ $caBundleFile }}" }
          {{- include "onyx.sandboxProxyEnv" (dict "proxyPort" $proxyPort "caBundleFile" $caBundleFile) | nindent 10 }}
        volumeMounts:
          - { name: sandbox-ca-source, mountPath: /sandbox-ca, readOnly: true }
        resources:
          requests:
            { cpu: "{{ $cpuReq }}", memory: "{{ $memReq }}", ephemeral-storage: "{{ $ephReq }}" }
          limits:
            { cpu: "{{ $cpuLim }}", memory: "{{ $memLim }}", ephemeral-storage: "{{ $ephLim }}" }
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          privileged: false
          capabilities:
            drop: ["ALL"]
            add: ["SETUID", "SETGID", "SETPCAP", "CHOWN"]
        startupProbe:
          tcpSocket:
            port: {{ $opencodePort }}
          periodSeconds: 2
          failureThreshold: 180
        readinessProbe:
          tcpSocket:
            port: {{ $opencodePort }}
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 10
    volumes:
      - name: sandbox-ca-source
        configMap:
          name: {{ $caConfigMap }}
          optional: false
{{- end }}
