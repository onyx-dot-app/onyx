name: onyx

services:
  api_server:
    environment:
      - WEB_DOMAIN=${WEB_DOMAIN:?WEB_DOMAIN must be set for CIMD tests}

  mock_oidc_idp:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MOCK_OIDC_CIMD_ONLY=true
      - MOCK_OIDC_EXPECTED_CLIENT_ID=${WEB_DOMAIN:?WEB_DOMAIN must be set for CIMD tests}/api/mcp/oauth/client-metadata
      - MOCK_OIDC_CLIENT_METADATA_CA_FILE=/etc/ssl/certs/mcp-cimd-ca.crt
    volumes:
      - ../data/sslcerts/mcp-cimd-ca.crt:/etc/ssl/certs/mcp-cimd-ca.crt:ro

  nginx:
    environment:
      - DOMAIN=host.docker.internal
      - SSL_CERT_FILE_NAME=mcp-cimd.crt
      - SSL_CERT_KEY_FILE_NAME=mcp-cimd.key
    ports:
      - "${MCP_CIMD_HTTPS_PORT:-3443}:443"
    volumes:
      - ../data/sslcerts:/etc/nginx/sslcerts:ro
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf
      && cp -a /nginx-templates/. /etc/nginx/conf.d/
      && sed 's/\r$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh
      && chmod +x /tmp/run-nginx.sh
      && /tmp/run-nginx.sh app.conf.template.no-letsencrypt"
