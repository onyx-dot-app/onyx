name: onyx

services:
  # Scripted OpenAI-compatible LLM for the Playwright stack. The backend reaches
  # it at http://mock_llm_server:8095; the Playwright runner scripts it through
  # the port published on host loopback (see web/tests/e2e/utils/mockLlm.ts).
  mock_llm_server:
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:latest}
    restart: on-failure
    working_dir: /workspace/backend
    environment:
      - PYTHONPATH=/workspace/backend
      - MOCK_LLM_SERVER_HOST=0.0.0.0
      - MOCK_LLM_SERVER_PORT=8095
    command: python -m tests.integration.mock_services.mock_llm_server.server
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - ../..:/workspace:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
