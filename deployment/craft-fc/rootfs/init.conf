# Craft Firecracker guest settings. Installed as /craft-fc/etc/init.conf.
# craft-init and attach read this file with bash. build-rootfs.sh writes
# DAEMON_CMD at the end of the installed copy.
#
# Every program that init starts must be in /craft-fc (read-only root, never
# under an overlay). Root in the guest can then not replace what init restarts.
# build-rootfs.sh checks that the DAEMON_CMD program is a file in /craft-fc.
# init reads this file only after it checks that /craft-fc is read-only.

# The guest daemon (vsock port 52). craft-init restarts it when it exits.
DAEMON_CMD=/craft-fc/bin/guest-daemon

# The in-guest egress proxy on 127.0.0.1:3128 (runs as uid 65534): the static
# relay from microvm/cmd/egress-relay (build-rootfs.sh --relay-bin). Init writes
# its PID to /run/craft-fc/egress-relay.pid for the daemon's SIGHUP reset.
# Set to an empty value when the guest daemon serves the proxy itself.
EGRESS_RELAY_CMD=/craft-fc/bin/egress-relay

# Variables for the daemon and the relay (proxy and CA settings, PATH).
ENV_FILE=/craft-fc/etc/guest.env

# Firecracker drive order: rootfs (vda), scratch (vdb), managed slot A (vdc),
# upload A/B (vdd, vde), managed slot B (vdf, last). See README.md.
# attach mounts slot A only. Slot B is the spare for a skills update; it may
# be absent (older templates).
SCRATCH_DEV=/dev/vdb
MANAGED_DEV=/dev/vdc
MANAGED_DEV_B=/dev/vdf

# Directories that get a writable overlay on the scratch disk. Never / or
# /craft-fc: attach refuses them.
OVERLAY_DIRS="/etc /home /root /opt /srv /usr /var /workspace"
