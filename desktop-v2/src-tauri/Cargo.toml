[package]
name = "onyx-desktop-v2"
version = "0.0.0-dev"
description = "Onyx Desktop v2 (preview)"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls: trust what the OS trusts (keychain roots, corporate TLS proxies).
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2.5"
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.15"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSTextField", "NSView", "NSWindow"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
