name: "Build Devcontainer Image"
description: "Builds and pushes the devcontainer Docker image with cache reuse"
inputs:
  runs-on-ecr-cache:
    description: "ECR cache registry from runs-on/action"
    required: true
  run-id:
    description: "GitHub run ID used in output image tag"
    required: true
  tag-prefix:
    description: "Prefix for the output image tag (the full tag will be <prefix>-<run-id>)"
    required: false
    default: "nightly-llm-it-devcontainer"
  ecr-registry:
    description: "ECR registry host for the Docker Hub pull-through cache (the ECR_REGISTRY repo variable)"
    required: true
  docker-no-cache:
    description: "Set to 'true' to disable docker build cache"
    required: false
    default: "false"
outputs:
  digest:
    description: "Digest of the pushed image. Consumers pull <runs-on-ecr-cache>@<digest>, never the mutable tag."
    value: ${{ steps.build.outputs.digest }}
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3

    - name: Log in to ECR pull-through cache
      uses: ./.github/actions/login-ecr-pullthrough-cache
      with:
        ecr-registry: ${{ inputs.ecr-registry }}

    - name: Build and push Devcontainer Docker image
      id: build
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
      with:
        context: .devcontainer
        file: .devcontainer/Dockerfile
        push: true
        build-args: |
          BASE_IMAGE_REGISTRY=${{ env.BASE_IMAGE_REGISTRY }}
        tags: ${{ inputs.runs-on-ecr-cache }}:${{ inputs.tag-prefix }}-${{ inputs.run-id }}
        # Reproducible builds would otherwise retag one digest every run and hit ECR's 1000-tags-per-image cap.
        labels: ci.run-id=${{ inputs.run-id }}
        # Attestations attach as ECR referrers to the image digest, which is
        # stable across runs and caps out at 100 per subject.
        provenance: false
        sbom: false
        # Any pull_request job can push to the RunsOn ECR cache, so only fork PR runs,
        # which get no secrets, import it. Other runs import only the published image.
        cache-from: |
          ${{ github.event.pull_request.head.repo.fork && format('type=registry,ref={0}:devcontainer-cache-{1}', inputs.runs-on-ecr-cache, runner.arch) || '' }}
          ${{ github.event.pull_request.head.repo.fork && format('type=registry,ref={0}:devcontainer-cache', inputs.runs-on-ecr-cache) || '' }}
          type=registry,ref=${{ env.BASE_IMAGE_REGISTRY }}/onyxdotapp/onyx-devcontainer:latest
        # A stable cache digest can collect 1000 SHA/PR tags. Bound exports to one tag per architecture.
        cache-to: |
          type=registry,ref=${{ inputs.runs-on-ecr-cache }}:devcontainer-cache-${{ runner.arch }},mode=max
        no-cache: ${{ inputs.docker-no-cache == 'true' }}
