name: Desktop v2
concurrency:
  group: Desktop-v2-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Desktop v2 (desktop-v2/) is a preview that lives beside desktop/. It has its
# own checks and builds, and never touches v1's release in deployment.yml.
on:
  pull_request:
    paths:
      - "desktop-v2/**"
      - "web/lib/opal/**"
      - ".github/workflows/desktop-v2.yml"

permissions:
  contents: read

jobs:
  check-and-build:
    name: Check and build (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy, rustfmt

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-v2/src-tauri/target/
          key: ${{ runner.os }}-desktop-v2-cargo-${{ hashFiles('desktop-v2/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-v2-cargo-

      # desktop-v2 builds Opal from web/lib/opal and resolves React from web/.
      - name: Install web dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Install desktop-v2 dependencies
        working-directory: ./desktop-v2
        run: bun install --frozen-lockfile

      # Also needed before Clippy: tauri::generate_context! reads dist/.
      - name: Build the local windows
        working-directory: ./desktop-v2
        run: bun run vite:build

      - name: Check Rust formatting
        working-directory: ./desktop-v2/src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: ./desktop-v2/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: ./desktop-v2/src-tauri
        run: cargo test

      - name: Type-check the local windows
        working-directory: ./desktop-v2
        run: bun run typecheck

      # Unsigned: reviewers open it with right-click > Open.
      - name: Build universal DMG
        working-directory: ./desktop-v2
        run: bun run tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onyx-desktop-v2-macos-universal-${{ github.run_id }}
          path: desktop-v2/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error
