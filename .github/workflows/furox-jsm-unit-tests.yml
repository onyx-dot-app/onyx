name: Furox JSM targeted unit tests

on:
  push:
    branches:
      - fix/jsm-upstream-compat-v2
    paths:
      - "backend/**"
      - ".github/workflows/furox-jsm-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsm-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ./backend
      DISABLE_TELEMETRY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare Python environment
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --no-config --no-deps --require-hashes \
            -r backend/requirements/default.txt \
            -r backend/requirements/dev.txt \
            -r backend/requirements/ee.txt
      - name: Run targeted JSM unit tests
        run: |
          .venv/bin/python -m pytest -q \
            backend/tests/unit/onyx/connectors/jira \
            backend/tests/unit/onyx/connectors/jira_service_management \
            backend/tests/unit/onyx/connectors/test_source_operation_coverage.py \
            backend/tests/unit/onyx/connectors/test_source_operation_import_fence.py \
            backend/tests/unit/onyx/connectors/test_source_operations.py
      - name: Lint and format changed Python files
        run: |
          files=(
            backend/onyx/connectors/jira/connector.py
            backend/onyx/connectors/jira/source_operations.py
            backend/onyx/connectors/jira/capability_checks.py
            backend/onyx/connectors/jira_service_management
            backend/tests/unit/onyx/connectors/jira/test_jira_source_operations.py
            backend/tests/unit/onyx/connectors/jira/test_jira_capability_checks.py
            backend/tests/unit/onyx/connectors/jira_service_management
            backend/tests/unit/onyx/connectors/test_source_operation_coverage.py
          )
          .venv/bin/ruff check "${files[@]}"
          .venv/bin/ruff format --check "${files[@]}"
