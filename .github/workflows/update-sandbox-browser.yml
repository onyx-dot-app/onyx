name: Update Sandbox Browser

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: update-sandbox-browser
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bases: ${{ steps.branches.outputs.bases }}
      reviewer: ${{ steps.branches.outputs.reviewer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - id: branches
        run: |
          heads="$(git ls-remote --heads origin 'refs/heads/release/v*')"
          bases="$(awk '{sub("refs/heads/", "", $2); print $2}' <<< "$heads" | sort -V | tail -4 | jq -Rsc 'split("\n") | map(select(length > 0)) | ["main"] + .')"
          echo "bases=$bases" >> "$GITHUB_OUTPUT"
          echo "reviewer=$(jq -r '.[]' .github/actions/slack-notify/cve-reviewers.json | shuf -n 1)" >> "$GITHUB_OUTPUT"

  update-sandbox-browser:
    needs: branches
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.branches.outputs.bases) }}
    uses: ./.github/workflows/reusable-agent-task-pr.yml
    with:
      task-name: sandbox-browser
      task-runner: deterministic
      base: ${{ matrix.base }}
      workflow-permission: true
      script: .github/scripts/update-browser-task.py
      diff-validator: .github/scripts/verify-browser-pin.py
      files: backend/onyx/server/features/build/sandbox/image/install-browser.sh
      branch: auto/sandbox-browser/${{ matrix.base }}
      pr-title: "chore(deps): update sandbox Chrome"
      reviewer: ${{ needs.branches.outputs.reviewer }}
      slack-channel: C0C6T9W2U3X
      slack-mention: ${{ needs.branches.outputs.reviewer }}
    secrets:
      CHERRY_PICK_APP_PRIVATE_KEY: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.CVE_REVIEWS_BOT_TOKEN }}

  notify-slack-on-failure:
    needs:
      - branches
      - update-sandbox-browser
    if: failure()
    runs-on: ubuntu-latest
    environment: ci-protected
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/slack-notify

      - name: Notify Slack about update failure
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.MONITOR_DEPLOYMENTS_WEBHOOK }}
          title: "🚨 Update Sandbox Browser workflow failed"
          details: "*The sandbox Chrome pin could not be refreshed.* Other branches continue independently. Check the run logs for the failed branch."
