name: PR Semantic Lint
concurrency:
  group: PR-Semantic-Lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Advisory. The check run concludes `success` or `neutral`, and the job passes on
# findings, missing secrets and linter errors alike. The semantic-lint-check
# pre-commit hook fails Quality Checks PR on an invalid rule file instead.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  semantic-lint:
    # Fork PRs get no secrets, so they skip with the drafts and Dependabot.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The merge ref, so the first PR that adds the linter can run it, and the
      # LLM's git grep sees the base tip plus the PR. The diff comes from the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      # 3.13 for PurePath.full_match, which the rule scopes use.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Run semantic lint
        id: lint
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TYPESAFE_API_KEY}" ] || [ -z "${OPENAI_API_KEY}" ]; then
            echo "outcome=skipped" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 tools/semantic-lint/lint.py pr "${PR_NUMBER}" --repo "${REPO}" \
            --publish-dir "${RUNNER_TEMP}/semantic-lint" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "outcome=reviewed" >> "${GITHUB_OUTPUT}"

      # A newer push starts a new run, so a stale review posts nothing.
      - name: Post the check run
        env:
          OUTCOME: ${{ steps.lint.outputs.outcome }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [ "${CURRENT_SHA}" != "${HEAD_SHA}" ]; then
            echo "The PR head moved to ${CURRENT_SHA}. Posting nothing."
            exit 0
          fi
          CHECK_RUN="${RUNNER_TEMP}/semantic-lint/check-run.json"
          if [ "${OUTCOME}" = "reviewed" ] && [ "$(jq -r .head_sha "${CHECK_RUN}")" = "${HEAD_SHA}" ]; then
            gh api --method POST "repos/${REPO}/check-runs" --input "${CHECK_RUN}" >/dev/null
            exit 0
          fi
          if [ "${OUTCOME}" = "skipped" ]; then
            TITLE="Skipped: TYPESAFE_API_KEY or OPENAI_API_KEY is not set"
          else
            TITLE="Linter error. The job log has the details."
          fi
          gh api --method POST "repos/${REPO}/check-runs" \
            -f name=semantic-lint -f head_sha="${HEAD_SHA}" \
            -f status=completed -f conclusion=neutral \
            -f "output[title]=${TITLE}" -f "output[summary]=${TITLE}" >/dev/null

      # The marker upsert from pr-golang-tests.yml. One comment per PR, edited in
      # place. A clean run edits an earlier comment and never posts a new one.
      - name: Upsert the summary comment
        if: steps.lint.outputs.outcome == 'reviewed'
        run: |
          set -euo pipefail
          SUMMARY="${RUNNER_TEMP}/semantic-lint/summary.md"
          MARKER="<!-- semantic-lint:summary -->"
          BODY="$(cat "${SUMMARY}")"

          # --paginate: on a long PR the marker can sit past the first page.
          EXISTING_COMMENT_ID=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if sed -n 2p "${SUMMARY}" | grep -qx '<!-- semantic-lint: clean -->' && [ -z "${EXISTING_COMMENT_ID}" ]; then
            echo "No findings and no earlier comment. Skipping the PR comment."
            exit 0
          fi

          if [ -n "${EXISTING_COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" -f body="${BODY}" >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${BODY}" >/dev/null
          fi
