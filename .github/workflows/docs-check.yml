name: Docs Check
concurrency:
  group: Docs-Check-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "documentation/**"
      - "web/lib/opal/src/logos/**"
      - "web/lib/opal/src/icons/**"
      - "web/lib/opal/scripts/export-svgs.tsx"
      - "backend/scripts/onyx_openapi_schema.py"
      - "backend/scripts/transform_openapi_for_docs.py"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/ee.txt
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Install web dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile
      - name: Generate logos, icons and openapi.json
        run: documentation/scripts/generate.sh
      - name: Install Mintlify CLI
        run: npm install --global mint@4.2.1159
      - name: Validate
        working-directory: ./documentation
        run: mint validate
      - name: Broken links
        working-directory: ./documentation
        run: mint broken-links
