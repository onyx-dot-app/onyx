### Regenerates backend/onyx/llm/well_known_providers/recommended-models.json
### via the OpenAI Responses API (backend/scripts/update_recommended_models_agent.py)
### and opens a reviewed PR when the model set changed. The file is live
### production config — deployments poll it from GitHub raw main — so changes
### always go through a human-reviewed PR, never a direct push.
###
### The agent decides which models each vendor actually recommends today
### (web search + OpenRouter catalog digest); the deterministic sibling script
### is the fallback when the agent can't run. All credentials / repair-loop /
### PR mechanics live in reusable-agent-task-pr.yml — when the PR's provider
### chat tests fail on the auto branch, the workflow_run trigger below
### re-invokes it with the failure logs so the agent fixes its own picks.

name: Update Recommended Models

on:
  schedule:
    - cron: "0 13 * * 1" # weekly, Monday 13:00 UTC (off the nightly 10:30/11:00 slots)
  workflow_dispatch:
    inputs:
      agent_model:
        description: "OpenAI model for the Responses API call (default: gpt-6-luna)"
        required: false
        default: ""
  # Repair trigger: chat-test failure on the auto PR branch. Safe — the
  # reusable job only proceeds for failures whose head_repository is this
  # repo and whose sha is still the open PR's head.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Recommended LLM Models Chat Tests"]
    types: [completed]
    branches: [auto/update-recommended-models]

# actions:read is required: a caller's permissions cap what the reusable
# workflow may grant GITHUB_TOKEN, and repair runs fetch the failed run's
# logs with it.
permissions:
  contents: read
  actions: read

jobs:
  update-recommended-models:
    uses: ./.github/workflows/reusable-agent-task-pr.yml
    secrets:
      CHERRY_PICK_APP_PRIVATE_KEY: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.CVE_REVIEWS_BOT_TOKEN }}
    with:
      task-name: recommended-models
      script: backend/scripts/update_recommended_models_agent.py
      fallback-script: backend/scripts/update_recommended_models.py
      files: backend/onyx/llm/well_known_providers/recommended-models.json
      branch: auto/update-recommended-models
      pr-title: "chore(llms): update recommended models"
      reviewer: rohoswagger
      slack-channel: C0C6T9W2U3X # #ai-pr-reviews
      slack-mention: rohoswagger
      agent-model: ${{ github.event.inputs.agent_model }}

  notify-slack-on-failure:
    needs:
      - update-recommended-models
    if: always() && needs.update-recommended-models.result == 'failure'
    runs-on: ubuntu-latest
    environment: ci-protected
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/slack-notify

      - name: Notify Slack about update failure
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.MONITOR_DEPLOYMENTS_WEBHOOK }}
          title: "🚨 Update Recommended Models workflow failed"
          details: "*The weekly recommended-models regeneration failed.* Check the run logs."
