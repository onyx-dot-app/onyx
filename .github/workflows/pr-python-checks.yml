name: Python Checks
concurrency:
  group: Python-Checks-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter needs pull-requests:read to list PR files on private repos (no-op on public).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          filters: |
            python:
              - 'backend/**'
              - 'pyproject.toml'
              - '.github/workflows/pr-python-checks.yml'
              - '.github/actions/setup-python-and-install-dependencies/**'

  mypy-check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    # See https://runs-on.com/runners/linux/
    # NOTE: This job is named mypy-check for branch protection compatibility,
    # but it actually runs ty (astral-sh's Rust type checker).
    runs-on:
      [
        runs-on,
        runner=2cpu-linux-arm64,
        "run-id=${{ github.run_id }}-mypy-check",
        "extras=s3-cache",
      ]
    timeout-minutes: 8

    steps:
      - uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt
            backend/requirements/model_server.txt
            backend/requirements/ee.txt

      - name: Run ty
        env:
          TERM: xterm-256color
        run: ty check --output-format github

  # Keeps the pull request in the merge queue while RunsOn reruns mypy-check
  # after an EC2 Spot interruption. The gate fails when mypy-check fails for any
  # other reason. Require "mypy-check-gate / pass" in the main ruleset, not
  # "mypy-check".
  mypy-check-gate:
    if: ${{ always() && needs.changes.outputs.python == 'true' }}
    needs: [changes, mypy-check]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # ratchet:runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}
