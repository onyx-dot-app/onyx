### Weekly QA pass over the hand-translated i18n catalogs
### (web/src/i18n/messages/). Authors translate the keys they touch in their
### own PRs, and CI blocks on key parity (web/AGENTS.md §7). This workflow
### runs web/scripts/i18n/qa.ts to review what changed since the last run —
### new keys and keys whose English source changed, per
### web/src/i18n/catalog.meta.json — keeping acceptable translations and
### correcting genuine defects, then opens a reviewed PR with the result.
### Corrections always go through a human-reviewed PR, never a direct push.

name: I18n Translation QA

on:
  schedule:
    - cron: "0 8 * * 1" # weekly, Monday 08:00 UTC (off the 13:00/14:00 Monday slots)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-qa
  cancel-in-progress: false

jobs:
  i18n-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CHERRY_PICK_APP_ID }}
          private-key: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: true
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity as App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning] produces a reviewed PR, no deploy artifacts
        with:
          bun-version: "1.3.13"

      - name: Install node dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Validate catalogs
        working-directory: ./web
        run: bun run i18n:check

      - name: QA-review new and changed translations
        working-directory: ./web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run i18n:qa

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Fixed branch + force-push: review work accumulates week over week,
        # so an already-open PR is refreshed with the latest run, not left
        # stale.
        run: |
          if git diff --quiet -- web/src/i18n; then
            echo "Catalogs already fully QA-reviewed. Nothing to do."
            exit 0
          fi

          branch="auto/i18n-qa"
          git switch -C "${branch}"
          git add web/src/i18n
          git commit -m "chore(i18n): weekly translation QA"
          git push --force origin "${branch}"

          existing_pr="$(gh pr list --state open --head "${branch}" --json number --jq '.[0].number')"
          if [ -n "${existing_pr}" ]; then
            echo "Refreshed existing PR #${existing_pr} via force-push."
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore(i18n): weekly translation QA" \
              --body "Generated by the [I18n Translation QA workflow run](${RUN_URL}). It reviews catalog keys that are new or whose English source changed since the last run, corrects defective translations, and updates \`web/src/i18n/catalog.meta.json\` (see \`web/scripts/i18n/qa.ts\`). Review the corrections like any other copy change."
          fi

  notify-slack-on-failure:
    needs:
      - i18n-qa
    if: always() && needs.i18n-qa.result == 'failure'
    runs-on: ubuntu-latest
    environment: ci-protected
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/slack-notify

      - name: Notify Slack about QA failure
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.MONITOR_DEPLOYMENTS_WEBHOOK }}
          title: "🚨 I18n Translation QA workflow failed"
          details: "*The weekly i18n catalog QA failed.* Check the run logs."
