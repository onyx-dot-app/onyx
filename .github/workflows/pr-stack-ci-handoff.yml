name: Stack CI Handoff

# The integration and Playwright suites run only at the tip of a stack of PRs.
# When a PR gains or loses a child PR, this workflow restarts the parent's runs
# so they skip or test it. See .github/scripts/stack-ci-handoff.sh.
on:
  pull_request:
    types: [opened, reopened, closed, edited]

concurrency:
  group: Stack-CI-Handoff-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hand-off:
    # Fork PRs get a read-only token, and the suites ignore fork children.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout handoff script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/stack-ci-handoff.sh
          sparse-checkout-cone-mode: false

      - name: Restart the parent PR's suites
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          OLD_BASE_REF: ${{ github.event.changes.base.ref.from }}
        run: bash .github/scripts/stack-ci-handoff.sh
