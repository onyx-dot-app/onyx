name: Sync FOSS Repo

# on:
#   schedule:
#     # Run daily at 3am PT (11am UTC during PST)
#     - cron: '0 11 * * *'
#   workflow_dispatch:
jobs:
  sync-foss:
    runs-on: ubuntu-latest
    environment: ci-protected
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout main Onyx repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo
        run: |
          sudo apt-get update && sudo apt-get install -y git-filter-repo

      - name: Set Git config
        run: |
          git config --global user.name "onyx-bot"
          git config --global user.email "bot@onyx.app"

      - name: Build FOSS version
        run: bash backend/scripts/make_foss_repo.sh

      - name: Push to FOSS repo
        env:
          FOSS_REPO_URL: https://x-access-token:${{ secrets.GH_PAT }}@github.com/onyx-dot-app/onyx-foss.git
        run: |
          cd /tmp/foss_repo
          git remote add public "$FOSS_REPO_URL"
          git push --force public main
