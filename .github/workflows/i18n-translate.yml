### Backstop for the hand-translated i18n catalogs (web/src/i18n/messages/).
### Authors translate the keys they touch in their own PRs (web/AGENTS.md §7);
### this workflow runs web/scripts/i18n/translate.ts nightly to fill whatever
### slipped through — keys missing from a locale, or keys whose English source
### changed since the last stamp — and opens a reviewed PR with the result.
### Translations always go through a human-reviewed PR, never a direct push.

name: I18n Translation Sync

on:
  schedule:
    - cron: "0 8 * * *" # nightly 08:00 UTC (off the 7:00/9:00/10:00+ slots)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-translate
  cancel-in-progress: false

jobs:
  i18n-translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CHERRY_PICK_APP_ID }}
          private-key: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: true
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity as App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning] produces a reviewed PR, no deploy artifacts
        with:
          bun-version: "1.3.13"

      - name: Install node dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Validate catalogs
        working-directory: ./web
        run: bun run i18n:check

      - name: Translate missing and stale keys
        working-directory: ./web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun run i18n:translate

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Fixed branch + force-push: catalog work accumulates day over day, so
        # an already-open PR is refreshed with the latest run, not left stale.
        run: |
          if git diff --quiet -- web/src/i18n; then
            echo "Catalogs already in sync. Nothing to do."
            exit 0
          fi

          branch="auto/i18n-translation-sync"
          git switch -C "${branch}"
          git add web/src/i18n
          git commit -m "chore(i18n): sync translations"
          git push --force origin "${branch}"

          existing_pr="$(gh pr list --state open --head "${branch}" --json number --jq '.[0].number')"
          if [ -n "${existing_pr}" ]; then
            echo "Refreshed existing PR #${existing_pr} via force-push."
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore(i18n): sync translations" \
              --body "Generated by the [I18n Translation Sync workflow run](${RUN_URL}). It backfills catalog keys that are missing from a locale or stale against their English source (see \`web/scripts/i18n/translate.ts\`). Review the translations like any other copy change."
          fi

  notify-slack-on-failure:
    needs:
      - i18n-translate
    if: always() && needs.i18n-translate.result == 'failure'
    runs-on: ubuntu-latest
    environment: ci-protected
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/slack-notify

      - name: Notify Slack about sync failure
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.MONITOR_DEPLOYMENTS_WEBHOOK }}
          title: "🚨 I18n Translation Sync workflow failed"
          details: "*The nightly i18n catalog sync failed.* Check the run logs."
