name: Desktop
concurrency:
  group: Desktop-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Checks and unsigned review builds of the desktop app (desktop/). The release
# build is build-desktop in deployment.yml.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "web/lib/opal/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  check-and-build:
    name: Check and build (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy, rustfmt

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      # The app builds Opal from web/lib/opal and resolves React from web/.
      - name: Install web dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: bun install --frozen-lockfile

      # Also needed before Clippy: tauri::generate_context! reads dist/.
      - name: Build the local windows
        working-directory: ./desktop
        run: bun run vite:build

      - name: Check Rust formatting
        working-directory: ./desktop/src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: ./desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        working-directory: ./desktop/src-tauri
        run: cargo test --locked

      - name: Type-check the local windows
        working-directory: ./desktop
        run: bun run typecheck

      # Unsigned: reviewers open it with right-click > Open. The cache restores
      # target/, so an older DMG is removed before the build.
      - name: Build universal DMG
        working-directory: ./desktop
        run: |
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          bun run tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # Fork pull requests get no installer artifact.
      - name: Upload DMG
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onyx-desktop-macos-universal-${{ github.run_id }}
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error

  # Same checks on Windows and Linux, plus unsigned installers for reviewers.
  check-and-build-windows-linux:
    name: Check and build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            artifact: windows-x64
            bundles: nsis,msi
            bundle-paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          # The oldest supported Ubuntu LTS: the bundles need the glibc they
          # are built with or newer.
          - name: Linux x64
            platform: ubuntu-22.04
            artifact: linux-x64
            bundles: appimage,deb,rpm
            bundle-paths: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ matrix.platform }}-desktop-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-desktop-cargo-

      - name: Install web dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: bun install --frozen-lockfile

      - name: Build the local windows
        working-directory: ./desktop
        run: bun run vite:build

      - name: Check Rust formatting
        working-directory: ./desktop/src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: ./desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        working-directory: ./desktop/src-tauri
        run: cargo test --locked

      - name: Type-check the local windows
        working-directory: ./desktop
        run: bun run typecheck

      # Unsigned: for reviewers only. Release builds are signed in
      # deployment.yml (build-desktop).
      # APPIMAGE_EXTRACT_AND_RUN: the runner has no FUSE for linuxdeploy.
      # NO_STRIP: linuxdeploy's strip cannot read some system libraries.
      # Cargo strips the Linux app binary instead.
      - name: Build installers
        working-directory: ./desktop
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          set -euo pipefail
          # The cache restores target/, so installers from an older build would
          # sit next to the new ones and be uploaded and checked with them.
          rm -rf src-tauri/target/release/bundle
          if [ "${RUNNER_OS}" = "Linux" ]; then
            export CARGO_PROFILE_RELEASE_STRIP=symbols
          fi
          # The run number goes in the version as build metadata (0.1.0+123),
          # so each build shows its own version. The MSI and NSIS file
          # versions get it as the fourth number.
          CONFIG=$(bun -e '
            const config = { version: require("./src-tauri/tauri.conf.json").version + "+" + process.env.GITHUB_RUN_NUMBER };
            console.log(JSON.stringify(config));
          ')
          bun run tauri build --bundles "${BUNDLES}" --config "${CONFIG}" -- --locked

      # The .deb declares libc6 (>= 2.35) in tauri.conf.json. No file in the
      # .deb or the AppImage may need a newer glibc.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        working-directory: ./desktop/src-tauri/target/release/bundle
        run: |
          set -euo pipefail
          FLOOR=2.35
          WORK="${RUNNER_TEMP}/glibc-check"
          mkdir -p "${WORK}"
          dpkg-deb -x deb/*.deb "${WORK}/deb"
          APPIMAGE=$(ls "${PWD}"/appimage/*.AppImage)
          (cd "${WORK}" && "${APPIMAGE}" --appimage-extract > /dev/null)
          NEEDED=$(find "${WORK}" -type f -exec sh -c 'file -b "$1" | grep -q "^ELF" && objdump -T "$1"' _ {} \; 2> /dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          echo "The bundles need glibc ${NEEDED} or newer."
          if [ "$(printf '%s\n' "${NEEDED}" "${FLOOR}" | sort -V | tail -n 1)" != "${FLOOR}" ]; then
            echo "glibc ${NEEDED} is newer than the declared floor ${FLOOR}." >&2
            exit 1
          fi

      # Fork pull requests get no installer artifact or attestation.
      - name: Attest build provenance
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ matrix.bundle-paths }}

      - name: Upload installers
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onyx-desktop-${{ matrix.artifact }}-${{ github.run_id }}
          path: ${{ matrix.bundle-paths }}
          retention-days: 14
          if-no-files-found: error
