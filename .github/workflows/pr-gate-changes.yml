name: Gate Changes

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR objects are read as data. Only the base is checked out.
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-changes:
    name: Protect lint gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The merge queue admits PRs after their required workflow passes.
      - name: Check PR admission
        if: github.event_name == 'merge_group'
        run: echo "The gate check runs on each PR before it enters the queue."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        if: github.event_name == 'pull_request_target'
        with:
          python-version: "3.13"

      - name: Install the lint parsers
        if: github.event_name == 'pull_request_target'
        run: |
          python3 -I -m pip --isolated install --only-binary=:all: --no-deps --require-hashes -r /dev/stdin <<'REQUIREMENTS'
          tree-sitter==0.25.2 --hash=sha256:b878e296e63661c8e124177cc3084b041ba3f5936b43076d57c487822426f614
          tree-sitter-typescript==0.23.2 --hash=sha256:e96d36b85bcacdeb8ff5c2618d75593ef12ebaf1b4eace3477e2bdb2abb1752c
          REQUIREMENTS

      - name: Fetch PR objects and check changes
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GATE_TEAM_TOKEN: ${{ secrets.GATE_TEAM_TOKEN }}
        run: |
          git -c credential.helper= -c "credential.helper=!gh auth git-credential" fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          python3 -I -c '
          import runpy
          import sys

          sys.path.append("backend")
          runpy.run_module("lint.check_gate_changes", run_name="__main__", alter_sys=True)
          ' "$BASE_SHA" "$HEAD_SHA" --pr "$PR_NUMBER"
