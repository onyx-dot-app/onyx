name: Preview Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@50.14.1
on:
  push:
    branches-ignore:
      - main
    paths:
      - "web/**"
permissions:
  contents: read
jobs:
  check-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check Vercel credentials
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_TOKEN" ]; then
            echo "has-credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-credentials=false" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials not set; skipping preview deployment."
          fi

  # Per-commit previews on the self-hosted local-preview server, which runs
  # the Next.js frontend and the FastAPI backend together at
  # <sha>-onyx.preview.onyxcorp.dev. Only the frontend is uploaded: this
  # workflow already builds it, and an uploaded side lands in the exact
  # content-addressed slot the server's own build would have targeted, so the
  # deploy skips it. The backend is built server-side from the same commit.
  #
  # Auth: uploads authenticate with a GitHub Actions OIDC token (hence
  # id-token: write) bound to this repository, which is the one the "onyx"
  # repo is registered from. No PAT and no session are involved — those gate
  # the dashboard and the previews themselves, not uploads.
  Deploy-Local-Preview:
    if: ${{ vars.PREVIEW_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
      # Matches the server's --github-oidc-audience (terraform sets it to the
      # server URL). The CLI would default to exactly this; naming it keeps
      # the two ends visibly pinned to each other.
      PREVIEW_GITHUB_OIDC_AUDIENCE: ${{ vars.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # ratchet:astral-sh/setup-uv@v9.0.0

      - name: Install the preview CLI
        run: uv tool install local-preview==0.9.0

      # Must match the frontend build in the server's own manifest for this
      # repo (manifests/onyx.toml in the terraform workspace) step for step —
      # an upload replaces what the server would have built, so a divergence
      # here is a preview that doesn't match what a rebuild would produce.
      #
      # @onyx-ai/opal depends on @onyx-ai/shared, so shared builds first.
      # (The Vercel job below has the two in the other order; it survives
      # because bun install's prepare scripts have already built both.)
      - name: Build the frontend
        working-directory: ./web
        run: |
          bun install --frozen-lockfile
          bun run --filter './lib/shared' build
          bun run --filter './lib/opal' build
          bun run build:fast
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true

      # The published tree becomes the process's working directory and the
      # manifest runs `node .next/standalone/server.js` in it, so the upload
      # has to keep that path — but nothing else. Shipping web/ wholesale
      # would mean uploading node_modules for no reason.
      - name: Assemble the upload tree
        run: |
          mkdir -p upload/.next
          cp -r web/.next/standalone upload/.next/standalone

      - name: Upload the frontend and deploy
        id: deploy
        run: |
          # Without pipefail the tee below would mask a failed upload.
          set -o pipefail
          preview upload frontend upload "$GITHUB_SHA" \
            --repo onyx --server "$PREVIEW_URL" --oidc --deploy | tee out.txt
          URL=$(sed -n 's/^ready: //p' out.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update PR comment with preview URL
        if: always() && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $GITHUB_REF_NAME, skipping comment."
            exit 0
          fi

          COMMENT_MARKER="<!-- local-preview-deployment -->"
          COMMENT_BODY="$COMMENT_MARKER
          **Full-stack Preview** (frontend + backend)

          | Status | Preview | Commit | Updated |
          | --- | --- | --- | --- |
          | ✅ | $PREVIEW_DEPLOYMENT_URL | \`${GITHUB_SHA::7}\` | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          Sign in with GitHub as an \`onyx-dot-app\` member to view it."

          EXISTING_COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_COMMENT_ID" \
              --method PATCH --field body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          fi

  Deploy-Preview:
    needs: check-credentials
    if: needs.check-credentials.outputs.has-credentials == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Pull Vercel Environment Information
        run: bunx ${{ env.VERCEL_CLI }} pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies and build Opal + Shared
        working-directory: ./web
        run: bun install --frozen-lockfile && bun run --filter './lib/opal' build && bun run --filter './lib/shared' build

      - name: Build Project Artifacts
        run: bunx ${{ env.VERCEL_CLI }} build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(bunx ${{ env.VERCEL_CLI }} deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Update PR comment with deployment URL
        if: always() && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Find the PR for this branch
          PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $GITHUB_REF_NAME, skipping comment."
            exit 0
          fi

          COMMENT_MARKER="<!-- preview-deployment -->"
          COMMENT_BODY="$COMMENT_MARKER
          **Preview Deployment**

          | Status | Preview | Commit | Updated |
          | --- | --- | --- | --- |
          | ✅ |  $DEPLOYMENT_URL | \`${GITHUB_SHA::7}\` | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"

          # Find existing comment by marker
          EXISTING_COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_COMMENT_ID" \
              --method PATCH --field body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          fi
