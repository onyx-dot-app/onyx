name: Nightly LLM Provider Chat Tests
concurrency:
  group: Nightly-LLM-Provider-Chat-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  schedule:
    # Runs daily at 10:30 UTC (2:30 AM PST / 3:30 AM PDT)
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-chat-test:
    uses: ./.github/workflows/reusable-nightly-llm-provider-chat.yml
    secrets:
      AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write
    with:
      openai_models: ${{ vars.NIGHTLY_LLM_OPENAI_MODELS }}
      anthropic_models: ${{ vars.NIGHTLY_LLM_ANTHROPIC_MODELS }}
      bedrock_models: ${{ vars.NIGHTLY_LLM_BEDROCK_MODELS }}
      vertex_ai_models: ${{ vars.NIGHTLY_LLM_VERTEX_AI_MODELS }}
      azure_models: ${{ vars.NIGHTLY_LLM_AZURE_MODELS }}
      azure_api_base: ${{ vars.NIGHTLY_LLM_AZURE_API_BASE }}
      ollama_models: ${{ vars.NIGHTLY_LLM_OLLAMA_MODELS }}
      openrouter_models: ${{ vars.NIGHTLY_LLM_OPENROUTER_MODELS }}
      gemini_models: ${{ vars.NIGHTLY_LLM_GEMINI_MODELS }}
      strict: true

  notify-slack-on-failure:
    needs: [provider-chat-test]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    environment: ci-protected
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download reproduce commands
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: reproduce-command-nightly-*
          path: reproduce-commands
          merge-multiple: true

      - name: Build Slack details
        id: slack-details
        shell: bash
        run: |
          set -uo pipefail

          DETAILS="*Failed job:* provider-chat-test"

          shopt -s nullglob
          files=(reproduce-commands/*.txt)
          if [ ${#files[@]} -gt 0 ]; then
            DETAILS="${DETAILS}"$'\n'"Supply your own credentials, then run from the Onyx dev container:"
            for f in "${files[@]}"; do
              DETAILS="${DETAILS}"$'\n\n'"$(cat "$f")"
            done
          else
            DETAILS="${DETAILS}"$'\n'"Open each failed provider job's *Summary* tab for a copy-paste command to reproduce locally."
          fi

          {
            echo "details<<SLACK_DETAILS_EOF"
            printf '%s\n' "$DETAILS"
            echo "SLACK_DETAILS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          details: ${{ steps.slack-details.outputs.details }}
          title: "🚨 Scheduled LLM Provider Chat Tests failed!"
          ref-name: ${{ github.ref_name }}

  detect-image-generation-failures:
    needs: [provider-chat-test]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      failed: ${{ steps.detect.outputs.failed }}
    steps:
      - name: Detect image generation test failures
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          failed=false
          for job_id in $(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            if gh api "repos/${REPO}/actions/jobs/${job_id}/logs" \
                | grep -Eq 'test_nightly_provider_image_generation\.py::.* FAILED|FAILED .*test_nightly_provider_image_generation\.py::'; then
              failed=true
            fi
          done
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

  # Image models that a vendor removed, or that Onyx cannot call, fail the
  # nightly. An agent classifies each failure and opens a reviewed fix PR.
  maintain-image-generation-models:
    needs: [detect-image-generation-failures]
    if: needs.detect-image-generation-failures.outputs.failed == 'true'
    uses: ./.github/workflows/reusable-agent-task-pr.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CHERRY_PICK_APP_PRIVATE_KEY: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.CVE_REVIEWS_BOT_TOKEN }}
    with:
      task-name: image-generation-models
      task-runner: claude-code
      prompt-file: .github/prompts/image-generation-maintenance.md
      validation-script: .github/scripts/validate_image_generation_maintenance.py
      files: backend/onyx/llm/price_table/_supplement.json backend/onyx/image_gen
      failure-run-id: ${{ github.run_id }}
      branch: auto/image-generation-models
      pr-title: "fix(image-gen): update image models after nightly failures"
      reviewer: rohoswagger
      slack-channel: C0C6T9W2U3X # #ai-pr-reviews
      slack-mention: rohoswagger
