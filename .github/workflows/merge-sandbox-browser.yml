name: Merge Sandbox Browser Update

on:
  # Runs only main code; PR contents are read as data and checked against a pin-only diff.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Dependency Audit]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  enable-auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'auto/sandbox-browser/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code runs with the App token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed commit and both browser jobs
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          base="${BRANCH#auto/sandbox-browser/}"
          [[ "$base" = main || "$base" =~ ^release/v[0-9]+\.[0-9]+$ ]] || exit 1
          gh api "repos/${REPO}/pulls?state=open&head=${REPO%%/*}:${BRANCH}" > "$RUNNER_TEMP/prs.json"
          number="$(jq -r --arg sha "$HEAD_SHA" --arg base "$base" --arg repo "$REPO" \
            '.[] | select(.head.sha == $sha and .base.ref == $base and .head.repo.full_name == $repo) | .number' "$RUNNER_TEMP/prs.json")"
          if [ -z "$number" ]; then exit 0; fi
          gh api --paginate --slurp "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -e '[.[].jobs[] | select(.name == "Sandbox browser audit (amd64)" or .name == "Sandbox browser audit (arm64)")] |
            length == 2 and all(.[]; .conclusion == "success" and
              any(.steps[]; .name == "Verify browser rendering and screenshots" and .conclusion == "success"))' "$RUNNER_TEMP/jobs.json" > /dev/null
          git fetch --quiet origin "$BRANCH" "$base"
          # Auto-merge is safe only after the required quality job enforces this
          # contract on future heads. Older release branches need the backport.
          git show "origin/$base:.github/workflows/pr-quality-checks.yml" | grep -q 'name: Validate automatic browser pin updates'
          python3 .github/scripts/verify-browser-pin.py "origin/$base" "$HEAD_SHA"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        if: steps.verify.outputs.number != ''
        with:
          client-id: ${{ vars.CHERRY_PICK_APP_ID }}
          private-key: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable merge after required reviews and checks
        if: steps.verify.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.verify.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
