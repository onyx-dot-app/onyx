name: Furox JSM one-time formatter

on:
  push:
    branches:
      - fix/jsm-upstream-compat-v2
    paths:
      - ".github/workflows/furox-jsm-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.1"
      - name: Format changed Python files
        run: |
          ruff format \
            backend/onyx/connectors/jira/connector.py \
            backend/onyx/connectors/jira/source_operations.py \
            backend/onyx/connectors/jira/capability_checks.py \
            backend/onyx/connectors/jira_service_management \
            backend/tests/unit/onyx/connectors/jira/test_jira_source_operations.py \
            backend/tests/unit/onyx/connectors/jira/test_jira_capability_checks.py \
            backend/tests/unit/onyx/connectors/jira_service_management \
            backend/tests/unit/onyx/connectors/test_source_operation_coverage.py
      - name: Commit formatting if necessary
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/onyx/connectors/jira backend/onyx/connectors/jira_service_management \
            backend/tests/unit/onyx/connectors/jira \
            backend/tests/unit/onyx/connectors/jira_service_management \
            backend/tests/unit/onyx/connectors/test_source_operation_coverage.py
          git commit -m "style(jsm): apply pinned Ruff formatting"
          git push origin HEAD:refs/heads/fix/jsm-upstream-compat-v2
