name: Run Jest Tests
concurrency:
  group: Run-Jest-Tests-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  jest-tests:
    name: Jest Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      # Jest Tests is a required check, so it must still report when nothing in
      # web/ changed; skip the work instead of the job. Every Jest input lives
      # under web/, including the vendored packages in web/lib/.
      - name: Detect web changes
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: |
            code:
              - 'web/**'
              - '.github/workflows/pr-jest-tests.yml'

      - name: Setup bun
        if: steps.filter.outputs.code != 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning] test-only workflow; no deploy artifacts
        with:
          bun-version: "1.3.13"

      - name: Install node dependencies
        if: steps.filter.outputs.code != 'false'
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Run Jest tests
        if: steps.filter.outputs.code != 'false'
        working-directory: ./web
        run: bun run test -- --ci --coverage --maxWorkers=50%

      - name: Upload coverage reports
        if: always() && steps.filter.outputs.code != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jest-coverage-${{ github.run_id }}
          path: ./web/coverage
          retention-days: 7
