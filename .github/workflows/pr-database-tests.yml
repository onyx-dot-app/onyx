name: Database Tests
concurrency:
  group: Database-Tests-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter needs pull-requests:read to list PR files on private repos (no-op on public).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.app.outputs.db || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          list-files: json
          base: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
          filters: |
            db:
              - 'backend/**'
              - 'tools/ods/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deployment/docker_compose/docker-compose.yml'
              - 'deployment/docker_compose/docker-compose.dev.yml'
              - '.github/workflows/pr-database-tests.yml'
              - '.github/actions/setup-python-and-install-dependencies/**'
              - '.github/actions/login-ecr-pullthrough-cache/**'
            agent_hook_tests:
              - 'backend/tests/unit/agent_hooks/**'
              - 'backend/tests/external_dependency_unit/agent_hooks/**'

      # Agent-hook tests need no app suite; the agent_hooks
      # external-dependency directory runs them.
      - name: Ignore agent-hook test files
        id: app
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          FILES: ${{ steps.filter.outputs.db_files }}
          HOOK_TEST_FILES: ${{ steps.filter.outputs.agent_hook_tests_files }}
        run: |
          count=$(jq -n --argjson f "$FILES" --argjson h "$HOOK_TEST_FILES" '$f - $h | length')
          if [ "$count" -gt 0 ]; then echo "db=true"; else echo "db=false"; fi >> "$GITHUB_OUTPUT"

  database-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.db == 'true') }}
    runs-on:
      - runs-on
      - runner=2cpu-linux-arm64
      - "run-id=${{ github.run_id }}-database-tests"
    timeout-minutes: 12
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: runs-on/action@4e5f72399b6b17f2e79c511c1b38a315a64d22dc

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt

      - name: Log in to ECR pull-through cache
        uses: ./.github/actions/login-ecr-pullthrough-cache
        with:
          ecr-registry: ${{ vars.ECR_REGISTRY }}

      - name: Start Docker containers
        working-directory: ./deployment/docker_compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d \
            relational_db

      - name: Run Database Tests
        working-directory: ./backend
        run: pytest tests/integration/tests/migrations/

  # Keeps the pull request in the merge queue while RunsOn reruns database-tests
  # after an EC2 Spot interruption. The gate fails when database-tests fails for
  # any other reason. Require "database-tests-gate / pass" in the main ruleset,
  # not "database-tests".
  database-tests-gate:
    if: ${{ always() && needs.changes.outputs.db == 'true' }}
    needs: [changes, database-tests]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # ratchet:runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}
