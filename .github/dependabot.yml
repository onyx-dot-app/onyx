version: 2

# Base image digests are NOT managed here. Dependabot's Docker parser rejects any
# `FROM` line that interpolates a variable, and every Dockerfile in this repo
# prefixes its base with the `${BASE_IMAGE_REGISTRY}` build arg, so a `docker`
# entry finds no dependencies and opens no pull requests. The
# .github/workflows/update-base-image-digests.yml job covers them instead, by
# running `ods update-base-digests`.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - "jmelahman"
    labels:
      - "dependabot:actions"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - "jmelahman"
    labels:
      - "dependabot:python"
    ignore:
      - dependency-name: "types-*"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - "jmelahman"
    labels:
      - "dependabot:javascript"
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - "jmelahman"
    labels:
      - "dependabot:javascript"
  - package-ecosystem: "bun"
    directory: "/backend/onyx/server/features/build/sandbox/image/templates/outputs/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - "wenxi-onyx"
    labels:
      - "dependabot:javascript"
      - "dependabot:sandbox"
