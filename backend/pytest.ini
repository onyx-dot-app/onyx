[pytest]
pythonpath =
    .
asyncio_default_fixture_loop_scope = function
# Long tracebacks print fixture arguments, and pytest truncates long reprs,
# so GitHub's exact-match secret masking misses credentials in CI logs.
addopts = --tb=short
markers =
    slow: marks tests as slow
    alembic: marks tests for alembic migration testing
    nightly: marks tests that should only run on the nightly schedule (skipped on PRs)
    craft_skill_isolation: snapshot/restore the Craft skill tables around each test
    manual_suite(*env_vars): opt-in manual suite under tests/manual; runs only when every named env var is 'true'
filterwarnings =
    ignore::DeprecationWarning
    ignore::cryptography.utils.CryptographyDeprecationWarning
# .test.env is gitignored.
# After installing pytest-dotenv,
# you can use it to test credentials locally.
env_files =
    .test.env
