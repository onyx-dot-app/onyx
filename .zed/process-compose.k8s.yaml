version: "0.5"

log_level: info
log_length: 2000
log_configuration:
  rotation:
    max_size_mb: 20
    max_age_days: 7
    max_backups: 3
    compress: true
  disable_json: true
  add_timestamp: true
  no_color: true
  flush_each_line: true

processes:
  web:
    command: bun run dev
    working_dir: ${ONYX_ZED_ROOT}/web
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.web
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/web.log
    namespace: frontend

  api:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python -m uvicorn onyx.main:app
      --reload
      --reload-exclude ${ONYX_ZED_ROOT}/backend/onyx/skills/builtin
      --reload-exclude ${ONYX_ZED_ROOT}/backend/onyx/server/features/build/sandbox/image
      --port 8080
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment:
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - SANDBOX_BACKEND=kubernetes
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8080
        path: /health
      initial_delay_seconds: 5
      period_seconds: 2
      failure_threshold: 60
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/api.log
    namespace: backend

  celery_primary:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.primary worker
      --pool=threads --concurrency=4 --prefetch-multiplier=1 --loglevel=INFO
      --hostname=primary@%n -Q celery
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: &celery_environment
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
      - SANDBOX_BACKEND=kubernetes
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-primary.log
    namespace: celery

  celery_light:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.light worker
      --pool=threads --concurrency=64 --prefetch-multiplier=8 --loglevel=INFO
      --hostname=light@%n
      -Q vespa_metadata_sync,connector_deletion,doc_permissions_upsert,checkpoint_cleanup,index_attempt_cleanup,index_reclaim,opensearch_migration
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: *celery_environment
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-light.log
    namespace: celery

  celery_heavy:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.heavy worker
      --pool=threads --concurrency=4 --prefetch-multiplier=1 --loglevel=INFO
      --hostname=heavy@%n
      -Q connector_pruning,connector_doc_permissions_sync,connector_external_group_sync,csv_generation,sandbox
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: *celery_environment
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-heavy.log
    namespace: celery

  celery_docfetching:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.docfetching worker
      --pool=threads --prefetch-multiplier=1 --loglevel=INFO
      --hostname=docfetching@%n -Q connector_doc_fetching
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: &celery_debug_environment
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
      - SANDBOX_BACKEND=kubernetes
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-docfetching.log
    namespace: celery

  celery_docprocessing:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.docprocessing worker
      --pool=threads --prefetch-multiplier=1 --loglevel=INFO
      --hostname=docprocessing@%n -Q docprocessing,port
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment:
      - ENABLE_MULTIPASS_INDEXING=false
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
      - SANDBOX_BACKEND=kubernetes
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-docprocessing.log
    namespace: celery

  celery_user_file_processing:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.user_file_processing worker
      --pool=threads --concurrency=2 --prefetch-multiplier=1 --loglevel=INFO
      --hostname=user_file_processing@%n
      -Q user_file_processing,user_file_project_sync,user_file_delete,user_file_port
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: *celery_environment
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-user-file-processing.log
    namespace: celery

  celery_scheduled_tasks:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.scheduled_tasks worker
      --pool=threads --concurrency=4 --prefetch-multiplier=1 --loglevel=INFO
      --hostname=scheduled_tasks@%n -Q scheduled_tasks
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: *celery_environment
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-scheduled-tasks.log
    namespace: celery

  celery_beat:
    command: >-
      ${ONYX_ZED_ROOT}/.venv/bin/python ${ONYX_ZED_ROOT}/backend/scripts/dev_celery_reload.py
      -A onyx.background.celery.versioned_apps.beat beat --loglevel=INFO
    working_dir: ${ONYX_ZED_ROOT}/backend
    env_file: ${ONYX_ZED_ROOT}/.vscode/.env.k8s
    environment: *celery_debug_environment
    log_location: ${ONYX_ZED_ROOT}/.zed/logs/celery-beat.log
    namespace: celery
