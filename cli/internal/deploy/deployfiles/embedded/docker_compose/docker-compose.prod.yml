# =============================================================================
# ONYX PRODUCTION OVERLAY
# =============================================================================
# Overlay to run Onyx as a hardened production deployment with TLS: nginx
# terminates HTTPS on 80/443 with Let's Encrypt certificates kept fresh by a
# certbot sidecar.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires Docker Compose v2.24.4+ (for the !override / !reset tags below).
#
# Before first start:
#   - Copy env.prod.template to .env and fill it in (strong POSTGRES_*,
#     MINIO_ROOT_* and S3_AWS_* credentials — not the dev defaults)
#   - Copy env.nginx.template to .env.nginx and set DOMAIN (and EMAIL)
#   - Obtain the initial certificates with ./init-letsencrypt.sh
#
# This overlay:
#   - Publishes only 80/443 on nginx (replacing the dev-style ${HOST_PORT}
#     mappings), serves the TLS nginx config (app.conf.template.prod), and
#     mounts the Let's Encrypt material
#   - Adds the certbot renewal service
#   - Defaults AUTH_TYPE to oidc and refuses to start on the default
#     MinIO/S3 credentials
#   - Runs MinIO unconditionally (drops the s3-filestore profile)
# =============================================================================

name: onyx

services:
  api_server:
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-oidc}
      - USE_IAM_AUTH=${USE_IAM_AUTH}
      - AWS_REGION_NAME=${AWS_REGION_NAME-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY-}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:?set a strong value in .env, not minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:?set a strong value in .env, not minioadmin}

  background:
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-oidc}
      - USE_IAM_AUTH=${USE_IAM_AUTH}
      - AWS_REGION_NAME=${AWS_REGION_NAME-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY-}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:?set a strong value in .env, not minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:?set a strong value in .env, not minioadmin}

  inference_model_server:
    environment:
      - MIN_THREADS_ML_MODELS=${MIN_THREADS_ML_MODELS:-}
      # Set to debug to get more fine-grained logs
      - LOG_LEVEL=${LOG_LEVEL:-info}

  indexing_model_server:
    environment:
      - MIN_THREADS_ML_MODELS=${MIN_THREADS_ML_MODELS:-}
      # Set to debug to get more fine-grained logs
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - VESPA_SEARCHER_THREADS=${VESPA_SEARCHER_THREADS:-1}

  nginx:
    # Only .env.nginx (DOMAIN, EMAIL, cert file names): the internet-facing
    # container has no use for the application secrets .env carries.
    env_file: !override
      - .env.nginx
    # Restating only the timeouts drops the base file's DOMAIN=localhost pin,
    # which would otherwise beat the .env.nginx value (environment entries win
    # over env_file).
    environment: !override
      # Nginx proxy timeout settings (in seconds)
      - NGINX_PROXY_CONNECT_TIMEOUT=${NGINX_PROXY_CONNECT_TIMEOUT:-300}
      - NGINX_PROXY_SEND_TIMEOUT=${NGINX_PROXY_SEND_TIMEOUT:-300}
      - NGINX_PROXY_READ_TIMEOUT=${NGINX_PROXY_READ_TIMEOUT:-300}
    # Production serves 80/443 only, replacing the dev-style ${HOST_PORT}
    # mappings (a plain merge would append and publish both sets).
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ../data/certbot/conf:/etc/letsencrypt
      - ../data/certbot/www:/var/www/certbot
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf
      && cp -a /nginx-templates/. /etc/nginx/conf.d/
      && sed 's/\r$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh
      && chmod +x /tmp/run-nginx.sh
      && /tmp/run-nginx.sh app.conf.template.prod"

  # follows https://pentacent.medium.com/nginx-and-lets-encrypt-with-docker-in-less-than-5-minutes-b4b8a60d3a71
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ../data/certbot/conf:/etc/letsencrypt
      - ../data/certbot/www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  minio:
    # Production always runs the S3 file store: lift MinIO out of the
    # s3-filestore profile so it starts without a COMPOSE_PROFILES entry.
    profiles: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a strong value in .env, not minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a strong value in .env, not minioadmin}
