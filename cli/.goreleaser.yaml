version: 2

project_name: onyx-cli

# GoReleaser OSS only understands plain semver tags (monorepo tag prefixes are a
# Pro feature), so CI builds against a local-only `vX.Y.Z` tag derived from the
# real `cli/vX.Y.Z` release tag. Publishing is handled outside GoReleaser: the
# GitHub release must target the real prefixed tag, and a bare `vX.Y.Z` tag can
# never be created upstream because that namespace belongs to the main product
# releases.
release:
  disable: true

# The release notes are generated by the workflow from commits touching `cli/`;
# GoReleaser OSS can't scope a changelog to a subdirectory.
changelog:
  disable: true

builds:
  - binary: onyx-cli
    env:
      - CGO_ENABLED=0
    # Match the ldflags contract of hatch_build.py: `main.version` carries the
    # `v` prefix (e.g. `v1.2.3`), `main.commit` the full SHA, and `-w` without
    # `-s` keeps the symbol table so govulncheck can scan released binaries.
    ldflags:
      - -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }}
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
