guidance = '''
When a function returns, or a container holds, several values with different meanings, define a BaseModel (or at least a NamedTuple) with named fields. Do not use a bare positional tuple type as the record.

Suggest a small BaseModel (or a NamedTuple) with named fields for the record, and show the field names.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines use a positional tuple of several values with different meanings as a record type."
true_what = "A return annotation such as tuple[bool, bool | None, int | None, str | None], a list[tuple[str, int, int]], or a dict keyed or valued by a multi-field tuple."
true_not_for = [
  "A two-value pair whose meaning the function name states. Tuples used as immutable sequences of one type.",
]
false_what = "The record is a BaseModel or NamedTuple, or the tuple is a short obvious pair."
false_not_for = [
  "`-> tuple[str, list[str], list[dict[str, Any]], list[CitationInfo], EvalTimings]`.",
]

