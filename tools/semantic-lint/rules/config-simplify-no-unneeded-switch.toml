]
near_misses = [3364320652]
needs_repo_search = false
guidance = '''
Do not add a boolean env var, compose variable or build ARG that turns a feature off, or an env var for an internal value such as a version string or an in-container path, unless deployments differ in a way that requires it. Ship the feature on by default and use a plain constant for internal values.

Ask why the value needs a switch, in the reviewer's words ("Why does this need a switch?"). Suggest shipping the feature on by default, or a plain constant for internal values. If the switch rolls out an unfinished feature, accept it and ask for a TODO(owner) that says when it goes away.
'''

[scope]
paths = ["backend/**/*.py", "deployment/**", "cli/internal/deploy/**"]

[question]
instructions = "The added lines introduce a new environment variable or boolean switch for a feature or an internal value."
true_what = "A new os.environ read, compose variable, Helm value or build ARG that turns a feature on or off, or sets an internal value such as a server version string or an in-container file path."
true_not_for = [
  "A switch that mirrors a real deployment difference, such as an image built without a binary. A flag that gates a large unfinished feature for incremental rollout. Operator-facing limits and endpoints.",
]
false_what = "The setting tracks a real difference between deployments, or it gates an unfinished feature during rollout."
false_not_for = ["A kill switch for a feature that every deployment runs."]

