# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Trim variable-length text to the token budget before prompting"
family = "other"
severity = "fix"
sources = [1931458604, 2027672016, 2027693406, 2027694936, 2071035284]
needs_repo_search = false
guidance = '''
Before you put retrieved documents, long tool output or other variable-length text into an LLM prompt, trim it to the model's remaining token budget and pass the trimmed value into the template.

Ask to trim the text to the model's remaining token budget, using the tokenizer_trim_* helpers in onyx/natural_language_processing/utils.py, before it goes into the template.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/onyx/**/*.py"]

[question]
instructions = "The added lines put retrieved documents, tool output or other variable-length text into an LLM prompt."
true_what = "A prompt template is formatted with document text, search results, tool output, chat history or file content whose length depends on the input."
true_not_for = [
  "Inputs already trimmed in the same function, or capped upstream with a visible limit. Fixed short values such as a user's name.",
]
false_what = "The text is trimmed to a token budget before formatting, or it is short and fixed."
false_not_for = [
  "`prompt.format(documents=docs_str)` with docs_str built from every retrieved document.",
]

[[flag]]
comment = 2071035284
said = "Somewhat worried about exceeding the llm context window; might be prudent to `trim_prompt_piece`"
code = '''
+    document_texts_list = []
+    for doc_num, doc in enumerate(retrieved_docs):
+        chunk_text = "Document " + str(doc_num + 1) + ":\n" + doc.content
+        document_texts_list.append(chunk_text)
+
+    document_texts = "\n\n".join(document_texts_list)
'''

[[flag]]
comment = 1931458604
said = "repeat call to format_docs, should pass in doc_context (also, this means the prompt is not trimmed correctly!)"
code = '''
+        msg = [
+            HumanMessage(
+                content=base_prompt.format(
+                    question=question,
+                    answered_sub_questions=remove_document_citations(
+                        sub_question_answer_str
+                    ),
+                    relevant_docs=format_docs(relevant_docs),
'''

[[clean]]
code = '''
doc_context = tokenizer_trim_content(doc_context, budget, tokenizer); PROMPT.format(relevant_docs=doc_context)
'''

[[clean]]
code = '''
PROMPT.format(question=question, today=today_str)
