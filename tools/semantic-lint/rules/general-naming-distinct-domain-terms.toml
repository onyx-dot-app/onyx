guidance = '''
When a new class, function, field or variable uses a word that already names a different Onyx concept (provider, hook, persona, user_id, document, response model), qualify it or pick another word so the two cannot be confused.

Name the Onyx concept the word already means, and suggest a qualified name that says what the value holds.
'''

