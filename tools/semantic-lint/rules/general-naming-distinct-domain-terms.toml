instructions = "The added lines give a new class, function, field or variable a name that already means a different Onyx concept."
true_what = "A new identifier named provider, hook, persona, user_id, document or a similar core term whose value is a different thing than the Onyx concept of that name."
true_not_for = [
  "Identifiers that hold the Onyx concept itself. Qualified names such as llm_provider or persona_prompt.",
]
false_what = "The name refers to the Onyx concept it names, or it is qualified."
false_not_for = ["`persona` that holds a prompt string."]

