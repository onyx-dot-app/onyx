guidance = '''
When code compares, sets or types a value from a fixed set of options or protocol tokens (a type, role, status, event, error code, provider or credential name, key prefix, expected LLM answer), use a StrEnum member or a named module constant and type the value with the enum. Parse raw strings into the enum at the boundary.

Suggest a StrEnum, or a named module constant, for the option set, typed on the parameter or field, with raw strings parsed into the enum at the boundary. For LLM output, suggest structured output into a model, or constants that are also injected into the prompt.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines use a raw string literal for one value of a fixed set of options or protocol tokens."
true_what = "A comparison, assignment, default or `-> str` annotation that carries one of a fixed set of option strings, a key prefix such as \"xoxp-\", an expected LLM answer, or a split on a marker copied from a prompt."
true_not_for = [
  "Literals defined once as a named constant or enum value. Free text such as log messages, prompts and user-facing copy. HTTP header values and MIME types. Values that must keep an external system's exact spelling, which may still be named.",
]
false_what = "The value comes from an enum member or a named constant, or the literal is free text."
false_not_for = ["`if tool_type == \"mcp\":` or `role=\"user\"` written inline."]

