# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Justify every type-ignore comment"
family = "other"
severity = "fix"
sources = [2082615070, 2091979935, 2430778423, 3358947012, 3917141139]
needs_repo_search = false
guidance = '''
Do not add a `# type: ignore` or `# ty: ignore` unless the checker is wrong about a third-party or framework type. Prefer a precise type or a narrowing check, and add a comment that says why when the suppression must stay.

Ask what the checker gets wrong. Suggest a precise type or a narrowing check, and if the suppression must stay, a short comment naming the third-party gap.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines add a `# type: ignore` or `# ty: ignore` comment."
true_what = "A new type-ignore or ty-ignore comment on a line of Onyx code."
true_not_for = ["Suppressions whose comment names the third-party or framework type gap."]
false_what = "The suppression carries a reason that names a third-party or framework gap."
false_not_for = ["A bare `# type: ignore` on a call into an Onyx function."]

[[flag]]
comment = 2082615070
said = "We really shouldn't have to type: ignore this one"
code = '''
+from pydantic import BaseModel  # type: ignore
'''

[[flag]]
comment = 2091979935
said = "prefer cast over type: ignore"
code = '''
+                        sum_metrics[i] += metric  # type: ignore
'''

[[clean]]
comment = 3917141139
code = '''
+        provider.api_secret = api_secret  # ty: ignore[invalid-assignment]
'''
