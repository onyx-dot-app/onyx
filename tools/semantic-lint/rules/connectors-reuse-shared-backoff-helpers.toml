# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Wrap connector API calls with the shared retry and rate-limit helpers"
family = "reuse"
severity = "fix"
sources = [2412076503, 3112650552, 3982855330]
near_misses = [2442700233]
needs_repo_search = false
guidance = '''
Wrap connector API calls with retry_builder, rate_limit_builder, or rl_requests (which honors Retry-After). Do not hand-write a backoff, use the next checkpoint call as the delay, or ask admins to tune rate limits.

Suggest retry_builder, rate_limit_builder, or rl_requests when the API sends Retry-After. If the shared helper lacks a needed case, suggest extending it so every connector gets it.
'''

[scope]
paths = [
  "backend/onyx/connectors/**/*.py",
  "backend/ee/onyx/connectors/**/*.py",
  "backend/ee/onyx/external_permissions/**/*.py",
]

[question]
instructions = "The added connector code implements its own backoff or retry for failed or rate-limited API calls."
true_what = "A connector defines its own retry loop with sleeps, a rate-limited get wrapper, a plan-tier or rate setting for admins, or relies on the next checkpoint call as the retry delay."
true_not_for = [
  "Calls already wrapped with retry_builder, rate_limit_builder or rl_requests. A source-specific retry that branches on status codes the shared helper cannot read, with a comment naming the gap.",
]
false_what = "The connector wraps its requests with retry_builder, rate_limit_builder or rl_requests."
false_not_for = ["A `_rate_limited_get` method with its own sleep loop."]

