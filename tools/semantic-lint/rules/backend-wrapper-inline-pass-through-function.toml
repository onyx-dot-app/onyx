guidance = '''
Do not add a function whose body only calls one existing function, passing its own parameters through, pinning one argument, wrapping the result in json.dumps, or reading one key from it. Call the underlying function directly and delete the wrapper.

Say the function only forwards to one call and adds a name but no logic, in the reviewers' words ("Not a fan of single line wrapper funcs"). Grep for its callers, then suggest that they call the underlying function directly, pass the pinned argument themselves, and that the wrapper is deleted. If the wrapper names a policy that several call sites share, or the PR is one layer of a stack whose later layer adds behavior, ask instead of asserting.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines define a function whose whole body is one call to another function."
true_what = "A new function or method whose only statement after an optional docstring returns, awaits or yields from one call to another function, passing its own parameters through, possibly with one pinned argument, a json.dumps around the call, or one key read from the result."
true_not_for = [
  "Bodies that add validation, error mapping, caching, logging or argument reshaping. Methods that a base class or protocol requires. Route handlers and Celery tasks that call one db helper. A wrapper that names a policy several call sites share.",
]
false_what = "The function has several statements of its own logic, holds or caches shared state, implements a required interface method, or is a route or task entry point."
false_not_for = [
  "A one-line forwarder that only renames the callee or pins one argument, even when it carries a docstring.",
]

