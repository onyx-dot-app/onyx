guidance = '''
When you add a fallback for data, sessions or payloads written by an older version, first ask whether the old state can be repaired, migrated or rejected when it is found. Do not keep compat code for a format that never shipped. If a fallback must stay, its comment names the skew it covers and when it can be deleted.

Ask whether the old state can be repaired, migrated or rejected when it is found. For a feature that has not shipped, ask to support only the current format. If the fallback must stay, ask for a comment that names the skew and the deletion condition in domain terms. Phrase it as a question.
'''

