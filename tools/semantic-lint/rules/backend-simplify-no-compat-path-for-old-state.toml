  "A guard whose comment names the rolling-deploy or client version skew it covers and when it can be deleted. Data of a released feature that users still hold.",
]
false_what = "The code handles only the current format, or the fallback documents the skew it covers and its removal condition."
false_not_for = [
  "A legacy-format branch for a Craft, sandbox or skills feature that has not shipped to users.",
]

