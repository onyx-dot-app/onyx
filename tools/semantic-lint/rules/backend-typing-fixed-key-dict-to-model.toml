guidance = '''
When a function returns, accepts, builds or reads a dict whose keys are a known fixed set, type it as a BaseModel (or a TypedDict when dict semantics are required). Validate a decoded third-party response into a BaseModel at the boundary, and serialize a model with model_dump instead of copying its attributes key by key.

Suggest a BaseModel, or a TypedDict when dict semantics are required. For a decoded third-party response, suggest validating it into a BaseModel at the boundary and reading typed attributes. For a dict copied from a model, suggest model_dump.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines build, return or read a dict whose keys are a known fixed set."
true_what = "A dict literal with fixed string keys returned from a function or route, a `dict[str, Any]` parameter whose keys the body reads by name, `response.json()` read with subscripts or .get, or a dict built from a model's attributes or __dict__."
true_not_for = [
  "`dict[str, Any]` for arbitrary JSON. Maps keyed by runtime ids. Wire formats that one model_dump policy cannot express. Missing annotations on local dict variables.",
]
false_what = "The data is a model or TypedDict, or the dict is keyed by runtime data."
false_not_for = ["`return {\"success\": True, \"sync_enabled\": enabled}` from a route."]

