# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Give the anonymous user basic access or less"
family = "other"
severity = "fix"
sources = [2482922444, 2711329146, 2711346204]
near_misses = [3574148669]
needs_repo_search = false
guidance = '''
Do not put the anonymous user or a missing user on the admin branch of a permission check, and do not skip access filters when the user is missing. Give them the access of a basic user or less, and raise when a user is required.

Say the anonymous or missing user must not share the admin branch or skip access filters. Suggest treating them as a basic user or less, and raising when the route requires a user.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines grant the anonymous user or a missing user more access than a basic user."
true_what = "A condition such as `str(user.id) == ANONYMOUS_USER_UUID or user.role == UserRole.ADMIN`, `if not user or user.role == UserRole.ADMIN`, or access filters built only when a user is present."
true_not_for = [
  "Checks that deny or restrict the anonymous user. Endpoints that are public by design and return no tenant data.",
]
false_what = "The anonymous or missing user gets basic access or less, or the code raises when a user is required."
false_not_for = ["`if not user or not is_user_admin(user):` that denies access."]

