guidance = '''
Prompt text is model input. Fix grammar errors, misspelled or wrong words, stray characters, sentences or examples that stop before they end, and literal \n escapes in triple-quoted strings that add blank lines.

Quote the faulty phrase and give the corrected text in one suggestion. Say prompt text is model input, so errors change model behavior.
'''

[scope]
paths = ["backend/onyx/prompts/**/*.py", "backend/**/*prompt*.py", "backend/**/*.md"]

[question]
instructions = "The added LLM prompt text contains a grammar, spelling or wording error."
true_what = "Duplicated or missing words, wrong articles or word forms, misspellings, stray characters, sentences or examples that end early, or literal \\n escapes inside triple-quoted strings."
true_not_for = [
  "Rewrites that only change style or tone. Log messages and identifiers. Placeholders and template syntax.",
]
false_what = "The prompt text reads correctly, or the change is a style preference."
false_not_for = ["\"Answer the the question\" in a system prompt."]

