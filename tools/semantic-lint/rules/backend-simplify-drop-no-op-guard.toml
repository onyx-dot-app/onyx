title = "Remove guards whose two paths give the same result"
family = "simplify"
severity = "nit"
sources = [2082618997, 2557877317, 2756610374, 2779826996, 3024423020, 4009843108]
near_misses = [3573271107]
needs_repo_search = false
guidance = '''
Remove an if, ternary or emptiness check whose two paths give the same result because the operation already covers the edge case, such as slicing past the end, `str.replace` with no match, `min` over one item, a loop over an empty list, or setting a field to its current value.

Name the operation that already covers the edge case, explain why both paths give the same result, and suggest deleting the check.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines contain a conditional whose two paths give the same result."
true_what = "An if, ternary or emptiness check guards an operation that already handles the edge case, so both paths produce the same value or effect."
true_not_for = [
  "Checks that avoid a network call, a database write, or an exception the operation would raise. Checks whose fallback differs from what the operation returns.",
]
false_what = "The two paths differ in value, in side effects, or in cost because one path skips an expensive call."
false_not_for = [
  "An emptiness check in front of a loop or a slice that already handles empty input.",
]

