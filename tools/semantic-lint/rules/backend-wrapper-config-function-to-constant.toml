# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Make process-lifetime config values module constants, not functions"
family = "wrapper"
severity = "fix"
sources = [3322007164, 4200229529]
near_misses = [4263287946]
needs_repo_search = false
guidance = '''
Do not wrap a value that depends only on startup configuration in a function, such as a zero-argument settings getter or a helper that builds a host list. Define it as a module-level constant computed once.

Ask the author to replace the function with a module-level constant computed once at import, as backend/AGENTS.md requires. If the value can be invalid, the loader logs and falls back to None instead of raising. Tests patch the module constant.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines define a function that returns a configuration value that stays fixed for the life of the process."
true_what = "A new function builds a settings object, URL or host list from env vars, app_configs constants or fixed strings, and its result does not depend on request, user, tenant or database data."
true_not_for = [
  "Functions whose result depends on the request, the user, the tenant or the database, and functions that create a client or connection object.",
]
false_what = "The function reads request, user, tenant or database state, or it constructs a client or connection."
false_not_for = [
  "A zero-argument getter that rebuilds the same value from env vars on every call.",
]

