# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Put model-facing prompt text in prompt files"
family = "placement"
severity = "fix"
sources = [2146339156, 3493149748]
needs_repo_search = false
guidance = '''
Put model-facing instruction text in backend/onyx/prompts/ or in the existing template file. Application code imports the prompt or fills its placeholders.

Ask to move the text to backend/onyx/prompts/ (or the existing template file, such as AGENTS.template.md for Craft) and to import it or fill its placeholders.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/onyx/**/*.py"]

[question]
instructions = "The added lines write model-facing instruction text inline in application code."
true_what = "A string literal or f-string that instructs a model (a system prompt, an agent instruction block, a static section of AGENTS.md content) is written in an application module outside backend/onyx/prompts/."
true_not_for = [
  "Files under backend/onyx/prompts/. Template files. A tool's name and short description fields in its schema. User-facing strings.",
]
false_what = "The text lives in a prompts module or a template file, and the application code imports it."
false_not_for = ["A multi-sentence system prompt built inline in a feature module."]

