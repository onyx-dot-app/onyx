guidance = '''
When the branches of a conditional repeat the same call, construction, query or return and differ only in one value, compute that value in the branches and run the shared statement once before or after the conditional. When consecutive ifs run the same body, join their conditions.

Point at the repeated statement and the value that differs. Suggest setting that value in the branches, or with a conditional expression, and making the call once after the conditional. When two ifs run the same body, suggest one condition joined with `or`.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines repeat the same call, construction or return in several branches of one conditional."
true_what = "Two or more branches of an if/elif/else end in the same function call, object construction, query or return with only an argument or one value different, or consecutive ifs run an identical body."
true_not_for = [
  "Branches that run different calls or different numbers of steps. A guard branch that only returns early. Branches whose shared statement is one short literal return.",
]
false_what = "Each branch does different work, or the shared statement already sits once after the conditional."
false_not_for = ["Branches that differ only in one keyword argument of the same call."]

