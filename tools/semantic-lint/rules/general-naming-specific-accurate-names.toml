guidance = '''
Name new classes, functions, types, endpoints, parameters and variables for their specific purpose, and pick a function name whose verb matches the body. Do not use a bare generic word such as base, Status, closer, backend or connector, or a verb that misdescribes the body.

Suggest a specific name that says which kind of thing the value holds, or a verb that matches the body. Phrase class and function renames as suggestions.
'''

[scope]
paths = ["**/*.py", "**/*.ts", "**/*.tsx"]

[question]
instructions = "The added lines introduce a name that describes its value or behavior imprecisely, such as a bare generic word or a verb that mismatches the body."
true_what = "A new identifier that is a bare generic word (base, Status, closer, Verifiable, backend, connector, get_boolean_value), or a function whose verb names a different action than its body performs (normalize for a check, expire for a renew)."
true_not_for = [
  "Names that match an external contract or framework hook. Short loop variables in small comprehensions. Renames of values passed to external systems.",
]
false_what = "The name states the specific thing held or the action performed."
false_not_for = ["A parameter named `backend` that holds a CacheBackend."]

