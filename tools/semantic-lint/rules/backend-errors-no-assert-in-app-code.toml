near_misses = [2658149236]
needs_repo_search = false
guidance = '''
In non-test backend code, replace `assert` with an explicit `if` check that raises a specific error such as ValueError or RuntimeError. This applies to asserts that only narrow a type for the type checker too.

Cite backend/AGENTS.md ("Reserve `assert` for tests") and suggest an explicit if check that raises ValueError or RuntimeError, with a log when useful.
'''

[scope]
paths = [
  "backend/onyx/**/*.py",
  "backend/ee/**/*.py",
  "backend/model_server/**/*.py",
  "backend/shared_configs/**/*.py",
]

[question]
instructions = "The added lines use an assert statement in application code."
true_what = "An `assert` statement in a module outside backend/tests, including asserts that only narrow an Optional for the type checker."
true_not_for = ["Files under backend/tests/. One-off scripts under backend/scripts/."]
false_what = "The added lines check the condition with an if and raise a specific error."
false_not_for = ["`assert session_id is not None  # guarded above` in a route module."]

