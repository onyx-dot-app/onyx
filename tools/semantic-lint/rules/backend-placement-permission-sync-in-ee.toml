guidance = '''
Put code that turns a source's sharing data into document read access under `backend/ee/onyx/external_permissions/<source>/`. CE connectors keep indexing, OAuth and credentials, and may call EE code through `fetch_versioned_implementation`.

Say permission-sync access logic belongs under backend/ee/onyx/external_permissions/<source>/ and that the CE connector may call it through fetch_versioned_implementation. Name the functions to move.
'''

[scope]
paths = ["backend/onyx/connectors/**/*.py"]

[question]
instructions = "The added lines in a CE connector compute which users or groups can read a document."
true_what = "Code under backend/onyx/connectors builds ExternalAccess, user email or group id sets, sharing-role checks, or a retrieve_all_slim_docs_perm_sync implementation from the source's collaborations, roles or ACLs."
true_not_for = [
  "Clients and credentials that indexing also needs. Calls into EE through fetch_versioned_implementation. Unchanged access code in older connectors.",
]
false_what = "The added lines index content, handle OAuth or credentials, or call an EE implementation through fetch_versioned_implementation."
false_not_for = [
  "A helper in the CE connector that decides whether a collaboration grants read access.",
]

