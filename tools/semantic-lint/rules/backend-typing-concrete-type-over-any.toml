guidance = '''
Give parameters, return values and fields their concrete type (an Onyx model, an SDK type, a union of the real types) instead of Any, object, list[Any], a bare list, or a union of unrelated value types such as int | str. Keep Any for values that are truly arbitrary.

Name the concrete type the value has (an Onyx model, an SDK class, or the real union) and suggest it. For a union of unrelated types, suggest normalizing the input to one type at the boundary.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines annotate a parameter, return value or field with Any, object, a bare container, or a union of unrelated value types."
true_what = "A signature or field annotation that uses Any, object, list[Any] or a bare list or dict for a value whose type Onyx code controls, or a union such as int | str or list[str] | str for one value."
true_not_for = [
  "Values that are truly arbitrary, such as tool call arguments, **kwargs forwarded to a library, or JSON blobs. Unions of typed input modes that the function dispatches on. Local variables.",
]
false_what = "The annotation names the concrete type, or the value is truly arbitrary."
false_not_for = [
  "`def shared_link_access_level(shared_link: Any) -> str | None:` for an SDK object.",
]

