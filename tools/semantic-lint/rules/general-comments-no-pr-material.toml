guidance = '''
Write comments and docstrings that state the one point a reader of the current code needs in a line or two. Do not restate the code, narrate the change or its history, list alternatives or measurements, or point at tickets, line numbers or internal docs. Put that material in the PR description.

Quote the part to cut. Suggest keeping the one point a reader needs in a line or two and moving history, alternatives, measurements and pointers to the PR description. Never suggest adding PR numbers or branch names to a comment.
'''

[scope]
paths = ["**/*.py", "**/*.ts", "**/*.tsx", "deployment/**/*.yaml"]

[question]
instructions = "The added comment holds PR-description material, such as a restatement of the next line, the history of the change, background reasoning, measurements, or a pointer to a ticket, line number or internal doc."
true_what = "A multi-sentence comment or docstring that explains background or alternatives, a comment that repeats what the next line or its identifiers say, a comment that describes what the code used to do or the change being made, or a comment with line numbers, ticket ids, internal doc paths or benchmark results."
true_not_for = [
  "A one-line reason for non-obvious code. A short warning that stops a likely mistake. TODO(owner) markers. Vendor documentation URLs for third-party formats. Docstrings that state a contract.",
]
false_what = "The comment states one fact the code cannot show, in a line or two."
false_not_for = ["`# Add bot token parameter` above the parameter it adds."]

