# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Derive from the existing setting or option"
family = "reuse"
severity = "fix"
sources = [
  2886724228,
  3321984698,
  3641316960,
  4199970202,
  4210510882,
  4210631647,
  4222431287,
]
near_misses = [3624986107]
needs_repo_search = true
repo_search_hint = "Grep backend/onyx/configs/app_configs.py, backend/shared_configs/, deployment/docker_compose/env.template and the component's existing props for a setting with the same unit or meaning (domain, URL, interval, token limit)."
guidance = '''
Do not add a constant, env var, flag, prop or connector setting whose value or effect restates an existing one. Reference or derive from the existing setting (for example WEB_DOMAIN), read the authoritative source such as the litellm model map, or extend the existing option.

Name the existing setting or option and suggest referencing it, deriving from it, or reading the authoritative source. For a new flag or prop, ask how it differs from the existing one.
'''

[scope]
paths = [
  "backend/**/*.py",
  "deployment/docker_compose/env.template",
  "web/src/**/*.ts",
  "web/src/**/*.tsx",
  "web/lib/opal/**/*.tsx",
]

[question]
instructions = "The added lines introduce a setting, flag or option whose value or effect restates an existing setting."
true_what = "A new constant or env var whose value equals or derives from an existing setting (instance domain, an interval, a model token limit), or a new flag, prop or connector field whose described effect matches an existing option."
true_not_for = [
  "An override that split-host or other real deployments need, with a comment saying when to set it. A flag that controls work no existing option covers.",
]
false_what = "The new setting controls something no existing setting covers, or it documents why it differs."
false_not_for = ["A comment such as \"Same cadence as X\" next to a new constant."]

