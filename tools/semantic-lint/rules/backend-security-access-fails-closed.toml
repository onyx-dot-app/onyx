# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Fail closed when access data is unknown or missing"
family = "other"
severity = "fix"
sources = [2281005482, 2281024255, 2482963880, 2482999954, 4119191873, 4243776886]
near_misses = [2907776508, 4243776898]
needs_repo_search = false
guidance = '''
In permission sync and document access code, map an unrecognized sharing value, a missing group or a failed lookup to the most restrictive access (owner only or no readers), and let access-filter failures propagate. Never let a fallback grant public or everyone access.

Ask that unknown values and failed lookups map to the most restrictive access (owner only or no readers), and that access-filter failures propagate so a failure denies access instead of granting it.
'''

[scope]
paths = [
  "backend/ee/onyx/external_permissions/**/*.py",
  "backend/onyx/connectors/**/*.py",
  "backend/onyx/access/**/*.py",
  "backend/**/*.py",
]

[question]
instructions = "The added lines choose a fallback access level when a sharing value, group lookup or access filter is unknown or fails."
true_what = "A default or except branch that maps an unknown sharing value to public or org-wide access, skips a missing group, or continues with a missing or empty access filter after an error."
true_not_for = [
  "Fallbacks to owner only or no readers. Errors that propagate. Skips of deleted entities that grant no access.",
]
false_what = "The fallback is the most restrictive access, or the error propagates."
false_not_for = [
  "`except Exception: access_filters = None` around build_access_filters_for_user.",
]

