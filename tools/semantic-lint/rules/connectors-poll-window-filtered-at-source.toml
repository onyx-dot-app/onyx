needs_repo_search = false
guidance = '''
When a connector polls for changes, pass start and end to the source API as a modified-since or date-range filter, and decide membership by the last-modified time of the item that becomes the document. Do not fetch the full listing and skip items in Python.

Ask to pass start and end to the source API as a modified-since or date-range filter. When the comparison uses creation time or a parent container's time, ask for the item's last-modified time.
'''

[scope]
paths = [
  "backend/onyx/connectors/**/*.py",
  "backend/ee/onyx/connectors/**/*.py",
  "backend/ee/onyx/external_permissions/**/*.py",
]

[question]
instructions = "The added lines filter fetched connector items by timestamp in Python against the poll window."
true_what = "A connector fetches a listing and then compares each item's timestamp with start or end to skip it, or compares the item's or parent's creation time with the window."
true_not_for = [
  "APIs that offer no date filter, with a comment saying so. A secondary check after the API already filtered by modified time.",
]
false_what = "The window goes to the API as a query parameter and the comparison uses last-modified time."
false_not_for = ["`if start and page.lastModified < start: continue` after a full listing."]

