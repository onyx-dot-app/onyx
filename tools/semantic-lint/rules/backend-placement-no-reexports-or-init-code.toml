# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Import names from their defining module, with no re-exports or __init__ code"
family = "placement"
severity = "fix"
sources = [3275593335, 3314734966, 3319263274, 3787124962]
near_misses = [2540172028]
needs_repo_search = true
repo_search_hint = "Grep for importers of the re-exported name to list the call sites that must change."
guidance = '''
Do not keep `from x import Y as Y`, `__all__` lists, back-compat re-exports, or imports and definitions in an `__init__.py`. Put code in a named module and update every caller to import from the module that defines the name.

Ask the author to delete the re-export and change each caller to import from the module that defines the name. For code in an `__init__.py`, cite the repo pattern of no `__init__.py` unless absolutely necessary and suggest a named module.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines expose a name from another module through a re-export or an `__init__.py` import."
true_what = "An import that exists only to expose the name again, such as `from x import Y as Y`, an `__all__` list of imported names, an `__init__.py` that imports a submodule's symbols or defines code, or a comment saying the import is kept for back-compat."
true_not_for = [
  "Imports used by code in the same file. An `__init__.py` import whose only job is to make decorator or Celery task registration run, with a comment saying so.",
]
false_what = "The imported name is used in the same file, or the diff removes a re-export and points callers at the defining module."
false_not_for = ["A `from x import Y as Y` line with a back-compat comment."]

