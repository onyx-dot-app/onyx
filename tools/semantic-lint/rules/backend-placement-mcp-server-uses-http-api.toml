title = "MCP server code calls the Onyx HTTP API"
family = "placement"
severity = "fix"
sources = [2540220431, 2540248814, 2542978418]
near_misses = [2540180330]
needs_repo_search = false
guidance = '''
Code in `backend/onyx/mcp_server/` calls the Onyx API server over HTTP with the caller's token. It does not open DB sessions, set tenant context, or call internal services.

Say the MCP server should reach Onyx through the HTTP API with the caller's token, so tenancy and auth are handled by the API server. Suggest the API route to call.
'''

[scope]
paths = ["backend/onyx/mcp_server/**/*.py"]

[question]
instructions = "The added lines in MCP server code use Onyx internals directly."
true_what = "MCP server code opens a DB session or pool, sets the tenant contextvar, or imports and calls internal services such as search providers."
true_not_for = [
  "HTTP calls to the Onyx API with the caller's bearer token, and parsing their responses with the backend's Pydantic models.",
]
false_what = "The added lines make an HTTP request to the Onyx API and parse the response."
false_not_for = ["A call to an internal provider factory inside an MCP tool."]

