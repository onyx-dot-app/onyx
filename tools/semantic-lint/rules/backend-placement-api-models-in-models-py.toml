# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Put API and settings Pydantic models in models.py"
family = "placement"
severity = "nit"
sources = [3382527495, 3574122593, 3624919902, 4200060497, 4203625304]
near_misses = [2342454867]
needs_repo_search = true
repo_search_hint = "Check whether the package already has a models.py and which modules import the model."
guidance = '''
Define Pydantic models for API requests, responses and settings in the package's `models.py`, not in `api.py`, `config.py` or other server modules.

Ask to move the model into the sibling `models.py`, creating it if needed, so the package matches the rest of server/. Mention that this often also removes a `TYPE_CHECKING` circular-import workaround.
'''

[scope]
paths = [
  "backend/onyx/server/**/*.py",
  "backend/ee/onyx/server/**/*.py",
  "backend/onyx/**/config.py",
]

[question]
instructions = "The added lines define a Pydantic BaseModel class in an API route or config module."
true_what = "A `class X(BaseModel):` is added to an api module, a router module, or a config or settings module whose file name is not models.py."
true_not_for = [
  "Classes added to a models.py file. Connector checkpoint models beside their connector. A model that one implementation file outside server/ uses alone. Moves into an import-heavy models.py such as connectors/models.py.",
]
false_what = "The class is in a models.py file, is not a Pydantic model, or is a single-consumer model outside server modules."
false_not_for = ["A request or response model defined right below `router = APIRouter(...)`."]

