# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Do not add parameters that only tests set"
family = "simplify"
severity = "nit"
sources = [3182962477, 3182965170, 3626401592]
near_misses = [3236910555]
needs_repo_search = true
repo_search_hint = "Grep for call sites that pass the parameter. Test-only call sites mean the parameter is test-only."
guidance = '''
Do not add a parameter such as `now: datetime | None = None` or a fetcher callable when only tests pass a non-default value. Call the real dependency inside the function and patch it at module level in the test.

Ask whether only tests pass a non-default value. If so, suggest calling the real dependency inside the function and patching it at module level in the test.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/onyx/**/*.py"]

[question]
instructions = "The added lines give a function a parameter that supplies the current time or a data-fetching function it could call directly."
true_what = "A new optional parameter for the current time, a clock, or a callable that fetches data, with a default that production callers leave in place."
true_not_for = [
  "Callables that production call sites set to different functions, such as a per-skill availability check. Dependency injection that the framework requires.",
]
false_what = "Production callers pass different values for the parameter."
false_not_for = ["A `now` or fetcher parameter that only test call sites override."]

