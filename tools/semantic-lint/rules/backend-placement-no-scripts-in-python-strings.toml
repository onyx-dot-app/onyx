# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Keep shell and Lua programs out of Python string literals"
family = "placement"
severity = "fix"
sources = [2796626564, 3390172620, 4018460868, 4200053778]
near_misses = [2146339156]
needs_repo_search = false
guidance = '''
Keep application logic in Python. Do not build multi-line shell or Lua programs in Python string literals. Use a script file in the repo, a daemon API call, or CacheBackend operations.

Say the program should live in a script file in the repo, a daemon API call, or CacheBackend operations, so it is versioned, tested and readable as code. For Redis logic, point to backend/AGENTS.md (use CacheBackend, do not write Lua scripts).
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines embed a multi-line program in another language inside a Python string literal."
true_what = "A triple-quoted or f-string literal holds a shell script, heredoc or Lua script that the code runs on a pod, in a sandbox, or in Redis."
true_not_for = [
  "SQL in Alembic migrations. A command passed as an argument list. Prompt templates. The docprocessing rate limiter, which runs Lua through the tenant Redis client on purpose.",
]
false_what = "The string is data, a prompt, SQL in a migration, or a one-line command."
false_not_for = ["A `_RATE_LIMIT_SCRIPT = \"\"\"` Lua string in feature code."]

