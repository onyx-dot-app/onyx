guidance = '''
When the same multi-line block, or the same comparison over several fields, appears more than once with only a name, flag or constant changed, move it into one helper that takes the changing value, or into a list or dict of cases with one loop or lookup.

Name both copies and the value that changes. Suggest one helper that takes the changing value, or a list or dict of the cases with one loop or lookup. A local function is fine when the block needs many variables.
'''

