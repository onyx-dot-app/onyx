guidance = '''
Before you hand-write general-purpose work in feature, connector, tool or route code (decode bytes, sniff a file type, batch or dedupe a list, retry, rate limit, validate an outbound URL, map extensions to MIME types, normalize a name, drain a checkpointed connector, a set operation written as a loop), use the shared helper or standard operation. If none fits, extend the shared helper or add the new one in the shared module.

Phrase it as a check, since about one time in four no helper exists. Grep the shared homes and name the helper you find, or say none was found. If one exists, suggest calling it and deleting the local copy, or extending it when it lacks an option. If none exists, suggest adding the helper to the shared module so the next caller finds it.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/onyx/**/*.py"]

[question]
instructions = "The added lines hand-write a general-purpose operation inside feature or connector code."
true_what = "Feature, connector, tool or route code computes a generic result itself, such as decoding bytes, a byte-signature table for image types, batching with range(0, len(x), n), deduplication, a retry or rate-limit loop, an SSRF IP-range check, an extension or MIME table, a strip().lower() name comparison, a loop that rebuilds a set difference or itertools.combinations, or a manual loop that drains a checkpointed connector."
true_not_for = [
  "Code that maps this source's own API payloads into Documents. Formats only this feature defines. Standard-library calls the codebase uses directly everywhere, such as mimetypes.guess_type. Thread pools and standard-format parsers, which their own rules cover. New code inside the shared utility module itself.",
]
false_what = "The added lines call an existing shared helper, map this source's own payloads, or sit inside the shared utility module."
false_not_for = [
  "A private feature-file helper that batches, dedupes, decodes or normalizes generic input.",
]

