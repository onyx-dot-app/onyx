guidance = '''
When a branch skips an item, returns a fallback, or filters out data because a field is missing or has an unexpected shape, log a warning that names the offending value, or raise if the case breaks an invariant. A comment or debug log is enough only when the case is expected and frequent.

Ask for a warning log that names the offending value, or a raise if the case breaks an invariant. If the case is expected and frequent, ask for a short comment that says so.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines skip an item or return a fallback when a field is missing or has an unexpected shape."
true_what = "A `continue`, early return or filter that drops data because an id, holder or field is missing, or because a value has an unexpected type, with no log above debug."
true_not_for = [
  "Skips with a warning log that names the value. Raises. Expected and frequent cases with a comment saying so. Guards for states that cannot happen, which the impossible-state rule covers.",
]
false_what = "The branch logs at warning or above with the value, raises, or carries a comment that says the case is expected."
false_not_for = ["`if not team.id: continue` inside a connector loop."]

