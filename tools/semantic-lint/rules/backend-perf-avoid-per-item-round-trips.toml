guidance = '''
Do not run a query, write or external API call once per item when one call gives the same result. Hoist loop-invariant calls, use one statement with an IN filter or a bulk insert, eager-load relationships that are read per row, and decide whether data is needed before fetching it.

Name the per-item call and suggest the batched form, such as computing the call once before the loop, one statement with an IN filter or a bulk insert, selectinload or joinedload for each relationship read, or skipping the fetch when the data is not needed.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines make a database query or external API call once per item of a loop."
true_what = "A query, DELETE, UPDATE, INSERT or API call inside a loop or per-item function, whose result is the same for every item or could be one batched call; ORM relationships read per row without selectinload or joinedload; data fetched and then dropped by the next step."
true_not_for = [
  "Loops over small fixed-size inputs. APIs that offer no batch call. Constant-factor tweaks on in-memory data.",
]
false_what = "The call runs once before the loop, uses one batched statement, or the loop is over a small fixed input."
false_not_for = [
  "A per-document relationship read inside a from_model loop without eager loading.",
]

