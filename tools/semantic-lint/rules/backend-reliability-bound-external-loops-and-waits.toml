guidance = '''
Give every loop over an external API's pages a generous iteration cap that logs and stops or fails loudly, plus an exit when a page adds no new items, and give every blocking wait on an external system a timeout. Do not rely only on the API to report the last page.

Ask for a generous iteration cap that logs a warning and stops, or fails loudly, when exceeded, an exit when a page adds no new items, and a timeout on blocking waits. Say a small cap that silently truncates data is the wrong fix.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines loop over an external API's pages or wait on an external system with an exit that depends only on that system's response."
true_what = "A `while True` or `while has_more` paging loop whose only exit is a field in the API response, an asyncio.wait or blocking call on a client or provider with no timeout, or a removed run_with_timeout."
true_not_for = [
  "Loops with a generous max-iterations bound that logs or raises. Loops that also exit when a page adds no new items. Waits that pass a timeout.",
]
false_what = "The loop has an iteration cap or a no-progress exit, or the wait has a timeout."
false_not_for = ["A `while True:` that breaks only when `next_page_token` is empty."]

