needs_repo_search = false
guidance = '''
In load_from_checkpoint, process one bounded unit (a page, a team, a space, a batch) and return the checkpoint. Keep checkpoint fields to cursors and capped collections, yield batches instead of accumulating input-sized lists, and check a file's size before or while downloading it.

Name the structure or loop that grows with the source. Suggest returning the checkpoint after one bounded unit, storing only a cursor or offset, yielding batches, or checking size metadata (or streaming with a cap) before downloading.
'''

[scope]
paths = [
  "backend/onyx/connectors/**/*.py",
  "backend/ee/onyx/connectors/**/*.py",
  "backend/ee/onyx/external_permissions/**/*.py",
  "backend/onyx/indexing/**/*.py",
  "backend/onyx/background/**/*.py",
]

[question]
instructions = "The added lines hold or process an amount of data in one call that grows with the size of the external source."
true_what = "A load_from_checkpoint that walks a whole listing before returning, a checkpoint field that stores a growing collection, a list that accumulates every item of an input-sized stream, or a file body read with .read() or .content before its size is checked."
true_not_for = [
  "Collections of ids that are small by nature. Inputs already capped upstream. Per-page lists that are yielded or cleared each page.",
]
false_what = "The code returns after one bounded unit, yields batches, stores only cursors, or checks size first."
false_not_for = ["A checkpoint field `seen_ids: list[str]` with no cap."]

