repo_search_hint = "Grep for the concept's owner, such as get_current_tier, credential_family_for_source, resolve_model_mode, user_can_access_*, can_manage_*, build_connector_kwargs, getters in backend/onyx/db/<entity>.py, construct_message_history and run_llm_step in backend/onyx/chat/, and the docfetching and indexing modules."
guidance = '''
Do not write a local version of a product-wide rule or pipeline step that a shared function already owns, such as the deployment tier, a credential family, a model type from its name, an access check, loading search settings, persisting hierarchy nodes, building a source client, changing index attempt status, an agent LLM loop, or building a connector from stored config. Call that function, and extend it when it lacks a condition.

Name the shared function you find and ask the author to call it so the two paths cannot drift. If it lacks a condition, suggest adding the condition there so every caller gets it. If nothing exists, suggest one shared function in the module that owns the concept.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/onyx/**/*.py"]

[question]
instructions = "The added lines define a helper or constant that decides a product-wide fact or performs a core pipeline step outside the module that owns it."
true_what = "A new private function, regex, frozenset or route-local helper that maps a source, model name or license to a product-wide category, combines access functions, loads search settings, persists hierarchy nodes, builds a source API client, sets index attempt status, runs an agent LLM loop, or reads one field of an entity that an existing getter loads."
true_not_for = [
  "Code inside the module that owns the concept. A helper that calls the shared function and only adds isolation, batching or error mapping. Sets of values that only this feature uses.",
]
false_what = "The added lines call the shared function, or they hold feature-only data."
false_not_for = ["A route-local `_assert_can_use_x` that re-combines existing access checks."]

