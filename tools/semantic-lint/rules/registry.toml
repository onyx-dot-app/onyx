# Settings every rule shares. Every other *.toml file in this directory is one
# rule, and its file stem is the rule id.

# Pinned. Part of every calibration seal, so a bump deactivates every rule
# until `lint.py eval --write` reruns.
jev_model = "jev-1.13.0"

# No rule screens these paths.
ignore = [
  "**/*.lock",
  "**/package-lock.json",
  "**/generated/**",
  "**/*.snap",
  "**/*.svg",
  "backend/requirements/*.txt",
  "web/src/i18n/messages/**",
  "web/tools/oxlint/anti-slop/**",
  "cli/internal/deploy/deployfiles/embedded/**",
]

[window]
# Part of every seal. Window size from 12 lines to a full hunk moved AUC by
# under 0.01, so the cut only bounds tokens.
max_lines = 40

[budget]
# Windows screened per PR, in path order.
max_windows = 600
# Windows the LLM reviews per PR, fix before nit, then by margin.
max_llm_windows = 12
max_findings_per_rule = 3
max_annotations = 30
# File patch context the LLM gets around a window.
patch_context_chars = 12000
# git grep lines a repo-search rule gets per window.
max_search_matches = 40

[llm]
model = "gpt-5-mini"
reasoning_effort = "low"
timeout_seconds = 180
never_flag = [
  "The bot flags unchanged code, a pattern copied from sibling code, or an issue that exists across the repo (HTTPException in old code, Retry-After parsing, Trivy settings, Alembic heads).",
  "On skills APIs and UI, the bot flags that EDITOR shares can delete, admins can edit or delete personal skills, new skills are private, there is no per-user quota, or curators can share to any group.",
  "The bot proposes a constant-factor optimization: avoid a second call, short-circuit a loop, use a Set instead of an Array, allocate lazily, reorder a check, skip a no-op sync or event.",
  "The bot asks to wrap a parse, dict lookup or API call in try/except, or to add a .get() default, so that a malformed or missing internal value does not raise.",
  "The bot asserts a bug from a wrong model of library or language behavior.",
  "Asks to add console.error or console.warn in a frontend catch block that shows a toast or falls back.",
  "The bot asks to narrow or rewrite a type the checker already accepts: remove `| None` because the DB column is NOT NULL, replace Any with a concrete type, parameterize a TypeAlias with a TypeVar, or add type ignores for NotImplemented.",
  "The bot asks for explicit type annotations on local variables, module constants or inner helper return types, citing the project typing standard.",
  "The bot asks a migration to log its outcome, mirror the upgrade scope in downgrade, scope downgrade deletes, or update a historic migration's constants to match later renames.",
  "The bot asks to rename an identifier or change a string literal for style consistency (underscore vs dash ids, class names, env value case, log message typos).",
  "The bot asks the docker compose install scripts to check TTYs, honor non-interactive runs, check UAC return values or reorder dry-run prompts.",
  "The bot claims a date is in the future or a pinned package version is not published, based on its training cutoff.",
  "The bot says the Ollama model-list fetch must send the configured API key.",
  "Flags failures that need two cc-pairs on one connector (shared config edits, missed backfills, token redirection).",
  "Asks for a provider-specific or proxy-specific exception to the private-network or loopback block (Azure private endpoints, localhost under DISABLED).",
  "Flags that a change breaks or skips the Vespa document index path.",
  "Asks to persist ephemeral UI state across reloads or in the URL (in-memory upload drafts, selected tab).",
  "Demands IllustrationContent for loading and error screens in the Craft output panel.",
  "The bot flags `field: list[...] = []` on a Pydantic model as a shared mutable default and asks for Field(default_factory=list).",
  "Cubic, from a learned team rule, asks seat-limit rejections to return HTTP 403 instead of 402.",
  "The bot says a query by id or a global setting leaks data across tenants.",
  "The bot warns that tenant ids with dots break key formats that split on '.'.",
  "The bot asks to make a constant env-configurable, or to remove a hardcoded default from an env config.",
  "Cubic's 'Multi-tenant awareness' custom agent asks for a tenant_id column and per-query tenant filters, or for tenant labels to collapse to 'all'.",
  "Flags that a Redis-only session or tenant lookup breaks multi-tenant deployments that use AUTH_BACKEND=postgres.",
  "Asks to loosen a test mock to *args/**kwargs, or to tighten a lambda mock to the exact production signature.",
  "Flags that concurrent indexing batches can overshoot the global token or cost budget and asks for atomic reservation.",
  "Flags a connector ClassVar boolean (capability flag) as a hardcoded boolean or asks to flip its base default for compatibility.",
  "Raises adversarial or live-data risks in test utilities that operate on private CI-only workspaces.",
  "Asks a stream packet parser to throw or log on a malformed packet instead of returning an unknown variant.",
  "The bot cites the AGENTS.md rule that DB operations live under backend/onyx/db and asks to move a Craft query there.",
  "The bot cites the 'do not use response_model' rule against `response_model=None` on an endpoint.",
  "The bot applies production CLI conventions (errors to stderr) to a one-off debugging script.",
  "Says an import from @opal/icons bypasses the required web/src/icons collection.",
  "Cites the backend rule that every enqueued Celery task needs expires= for the docfetching task send.",
  "Asks to log the error detail before raising an OnyxError.",
  "Claims populate_existing=True on a SELECT silently reverts unflushed edits in the same session.",
  "Asks to scrub credentials from api_base URLs in traces or errors.",
  "Flags that the PR exceeds the line-count limit and asks to split it.",
  "Asks the ods CLI to handle errors from status-line writes such as `_, _ = fmt.Fprintf`.",
  "Asks the PR to update documentation that lives in another repository.",
  "Suggests that code comments cite PR numbers or branch names (for example to say when a temporary entry can be deleted).",
  "The diff removes, inverts or replaces an old check, fallback or behavior, and the bot reports the new behavior as a bug or regression.",
  "The bot reports a crash or wrong result for a None, zero, empty, duplicate or malformed value that an upstream invariant already rules out.",
  "Flags a defect in code the PR only moved, renamed, or left unchanged, or that keeps the behavior of the code it replaces.",
  "The bot asks for a compatibility path, a backfill or a scoped delete to protect existing data or saved state from before the change.",
  "Claims missing wiring, a missing call site, or wrong behavior of an existing helper that the reviewer shows is false.",
  "Asserts how an external tool, library, API, or platform behaves (govulncheck, LiteLLM, OpenCode, tsc, Transformers, Gmail scopes, Salesforce, Alembic, pypdf).",
  "Demands explicit type annotations (or casts) on new local variables whose type the checker already infers.",
  "The bot proposes a generic best practice (different exception construction, newer form components, input validation, logging, FK constraints, dedup into a shared util) that diverges from how sibling code in the same area does it.",
  "Flags a narrow race (concurrent creates, admin edits, publication swaps, lease expiry) and asks for advisory locks, serialization, or version checks.",
  "Flags that a new backend field, helper, or operation has no caller, no frontend wiring, or no cleanup path yet.",
  "Cites the rule that all DB operations live under backend/onyx/db or backend/ee/onyx/db and asks to move SQL out of a feature-local DAL or infrastructure adapter.",
  "Asks for a compatibility path, alias, or data migration so legacy rows, legacy env vars, or old API fields keep working after a stricter contract.",
  "The bot asks to keep supporting a mode, flag or branch that the PR stops honoring (a beta flag, a non-admin OAuth branch, demo data, a disabled-proxy setup, custom API bases).",
  "The bot flags an unused parameter, a stub, a schema-only table with no readers, a public helper with one caller, or missing API surface in a PR that is one layer of a stack.",
  "Flags that old and new pods disagree during a rolling deployment (enum values, lock keys, task signatures, state formats).",
  "Flags a failure that needs an input or state that a validator, UI gate, or creation path elsewhere already rejects.",
  "Flags failure under extreme operator config (keepalive above 450s, timeouts above 24 days) or extreme input sizes, and asks for bounds or eviction.",
  "The bot flags missing validation, logging, retry or atomicity that a caller, builder, later flow step or task retry already provides.",
  "Reverses a behavior that a comment, docstring, or the PR itself declares as an accepted trade-off.",
  "The bot reports a race or TOCTOU window and proposes a threading lock, synchronized set or atomic check-and-set.",
  "The bot predicts unbounded memory growth, a missing queue maxsize, an N+1 query or lost batching without evidence of a real size problem.",
  "The bot asks to isolate a rare failure: per-item try/except so one group does not abort a sync, wrap usage tracking, clean up staged files on error, or add error handling to a helper.",
  "The bot flags a log line or pod env var as a credential leak when it holds a session id, tenant id, raw HttpError text or a per-user sandbox PAT.",
  "Asks for an extra client-side guard, error state, or history interception for a rare sequence (sub-second load window, lost provider while queued, back button, hour-long recovery).",
  "The bot flags `if x:` or `x or y` on an optional string, number or list because it treats 0, empty string or empty list as None, and asks for `is not None`.",
  "Asks for atomicity, retries, or repair when a derived projection (sandbox files, index entries, permission caches) can lag the source of truth.",
  "The bot asks to replace `except Exception` with specific exception types.",
  "Demands a frontend convention (translation catalog, padding over wrapper div, page-object locators) for one new line in a file that does not follow that convention anywhere yet.",
  "Demands that a Pydantic model move to models.py or a page card move to web/src/sections/cards/.",
  "Asks a test to cover behavior that belongs to another test layer (HTTP middleware in an external-dependency-unit test, async indexing in a Playwright spec, exact live content in a daily connector test).",
  "Flags a failure in a configuration or user flow the product does not support (raw pasted app IDs, IPv4-primary dual-stack, direct subagent follow-ups).",
  "Cites the rule that new non-/api routes need nginx and Helm ingress routing, for routes on a router prefix such as /manage.",
  "Flags that an Alembic downgrade() does not exactly reverse upgrade() (removes rows or values the upgrade skipped, or deletes new rows).",
  "Flags missing backfill or data repair for a feature that was just introduced, is unreleased, or is in beta.",
  "Asks to isolate a failure per item, retry a failed step, or keep retrying initialization instead of letting the failure surface.",
  "Posts a finding against a hunk that later commits in the same PR already changed or removed.",
  "The bot applies the Craft Storybook rule to components outside web/src/app/craft/components, or to a PR whose stories land in the next stacked PR.",
  "The bot flags set iteration or a query without ORDER BY as nondeterministic and asks for a stable order.",
  "Demands `string | RichStr` for a text prop that is interpolated into a larger plain string or used as an aria-label.",
  "Says every external-dependency-unit test must use the enable_ee fixture.",
  "Cites the CacheBackend rule for a docprocessing rate limiter that calls Redis and Lua directly.",
  "Asks an integration test to delete the connectors, credentials, or pairs it creates.",
]

[calibration]
confidence = 0.80
min_positives = 3
# Share of PRs, by PR-number hash, held out to report precision and recall.
report_percent = 30

# A rule posts when the Wilson lower bound of its tune-split precision meets
# this. Below it, the rule runs in shadow and posts nothing.
[calibration.min_precision]
fix = 0.5
nit = 0.6

[eval]
# Negatives eval screens per rule, a deterministic sample by window id. Positives
# and near misses are always kept. Precision is an estimate on this sample.
max_negatives_per_rule = 2000

[prices]
jev_input = 0.042
llm_input = 0.25
llm_output = 2.0
