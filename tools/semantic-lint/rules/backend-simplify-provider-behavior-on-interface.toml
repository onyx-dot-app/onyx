guidance = '''
Do not add a branch for one named provider, source or subclass in code that serves all of them, and do not keep a hand-maintained list of per-type facts outside the types. Put the behavior or flag on the provider interface or enum member and let each type declare it.

Say that each future provider would need another branch here. Suggest a method or class attribute on the provider interface with a default that the specific provider overrides, or a flag declared on the enum member from which any collection is derived.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines branch on one named provider, source or subclass inside code that serves all of them."
true_what = "Shared code compares a provider name, a DocumentSource or a class with `==`, `!=` or isinstance to give one of them special behavior, or keeps a list of per-type facts that must be updated by hand when a type is added."
true_not_for = [
  "Code inside the provider's own module. Dispatch tables that a provider registry builds. Connector ClassVar capability flags that a base class declares and each subclass overrides.",
]
false_what = "The behavior lives on the provider interface or the type, or the code sits in the provider's own module."
false_not_for = [
  "One `if source == X` special case added to shared code, even when a comment explains it.",
]

