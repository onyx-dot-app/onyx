guidance = '''
Do not add a check for a value or shape that the declared type or earlier code already rules out, such as a None check on a value typed without None, an isinstance branch for a shape the annotation excludes, a reset to a default the variable already holds, or a second dedup. Fix the type if it is wrong.

Name the annotation or earlier line that makes the case impossible and suggest deleting the check. If the type itself is wrong, suggest fixing the type at its source. When the guarantee is outside the hunk, ask instead of asserting.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines check for a value or type that the declared annotation or an earlier line in the window already rules out."
true_what = "A None check on a value typed without None, an isinstance branch for a shape the annotation excludes, a reset to a default the variable already holds, or a second dedup of data deduped a few lines above."
true_not_for = [
  "Checks at a trust boundary such as raw JSON, user input or third-party responses. Narrowing that the type checker requires for an Optional. Guards whose guarantee lives outside the window.",
]
false_what = "The value comes from outside the process, or its declared type admits the checked case."
false_not_for = [
  "An isinstance or None check on a parameter whose annotation already excludes that case.",
]

