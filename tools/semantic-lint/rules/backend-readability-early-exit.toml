guidance = '''
When one path of a loop or function only skips, returns or raises, test that case first and exit with continue, return or raise, so the main work runs one level less indented.

Suggest inverting the condition and exiting first with continue, return or raise, so the main logic sits one level less indented. Show the guard line.
'''

