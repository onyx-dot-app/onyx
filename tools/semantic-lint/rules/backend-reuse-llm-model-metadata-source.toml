# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Read model capabilities and limits from litellm or provider metadata"
family = "reuse"
severity = "fix"
sources = [2591235235, 2591248884, 2591338265, 3991993200]
near_misses = [2992465457]
needs_repo_search = true
repo_search_hint = "Grep backend/onyx/llm/ for get_model_map and the provider metadata helpers that already resolve the field."
guidance = '''
Set supports_image_input, supports_reasoning and token limits from litellm (get_model_map()), the provider's metadata, or the base model. Do not hardcode False, a fallback limit, or a table keyed by model names.

Ask to read the value from litellm (get_model_map()), the provider's metadata, or the base model, so a new model release needs no code change and models do not fall back to a low limit.
'''

[scope]
paths = ["backend/onyx/llm/**/*.py", "backend/onyx/server/manage/llm/**/*.py"]

[question]
instructions = "The added lines set LLM model capabilities or token limits from literal values in code."
true_what = "A capability field set to a literal True or False, a hardcoded fallback token limit, or a dict, list or set keyed by specific model names that stores per-model limits or capabilities."
true_not_for = [
  "Values read from litellm, provider metadata or the base model. Lists of model families used only for matching ids.",
]
false_what = "The added lines read the value from litellm, the provider, or the base model."
false_not_for = [
  "`supports_reasoning=False` with a comment saying the provider lacks metadata.",
]

