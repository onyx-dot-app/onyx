needs_repo_search = false
guidance = '''
Import onyx, ee and shared_configs modules at module top level and order definitions so annotations resolve. A function-local first-party import, an `if TYPE_CHECKING` block, `from __future__ import annotations` or a quoted type name used to dodge a cycle points to a module boundary to fix.

Ask why the import cannot sit at module top level. Say a cycle indicates a module boundary problem, and suggest moving the shared piece to a lower-level module or reordering definitions. Accept the deferred form only when a real cycle remains, with a comment that names it.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines defer a first-party import or type through a function-local import, a TYPE_CHECKING block, a future-annotations import, or a quoted type name."
true_what = "An `import` of an onyx, ee or shared_configs module inside a function or method body, an `if TYPE_CHECKING:` import block, `from __future__ import annotations`, or a quoted annotation such as `\"From | None\"`."
true_not_for = [
  "Third-party modules on the ods check-lazy-imports list (openai, litellm, tiktoken, transformers, nltk), which must be imported inside functions. Registration imports. A forward reference that a real cycle forces after the module boundary is fixed.",
]
false_what = "The import sits at module top level, or it is a third-party module that check-lazy-imports requires to be lazy."
false_not_for = [
  "A function-local `from onyx.db...` import with a comment saying it avoids a circular import.",
]

