needs_repo_search = false
guidance = '''
An except block that continues must at least log at warning or above, or carry a comment that explains why silence is safe. In code that yields documents, builds permissions or parses data the caller depends on, let the error propagate or record it as a per-document failure instead of logging and continuing.

If nothing logs, ask for a log at warning or above that names the value, or a comment explaining why silence is safe. If the fallback makes the result wrong (empty documents, missing permissions), ask to let the error propagate or to record a per-document failure.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines catch an exception and continue as if the operation succeeded."
true_what = "An except that passes, continues, or returns a fallback value, an except that logs at debug or info and continues, or an except that logs and continues in code whose output the caller treats as complete."
true_not_for = [
  "Per-item isolation in a loop that logs at warning or above with exc_info. Best-effort teardown that logs. Handlers that re-raise or raise a different error. A fallback with a comment saying why silence is safe. Frontend catch blocks that show a toast.",
]
false_what = "The handler re-raises, raises a specific error, or logs at warning or above inside per-item isolation."
false_not_for = ["`except ValidationError: pass` around parsing that the caller depends on."]

