near_misses = [3326685245, 3626409837, 3972662552, 3973825942]
needs_repo_search = true
repo_search_hint = "Grep for callers of the helper. Several callers that must agree on one key or format are the exception."
guidance = '''
Do not add a helper whose body is one short expression or constant, such as a string format, a dict .get(), a strip().lower(), an `x or None`, a flag combined with a call, `return True`, or one constructor call. Write the expression at the call site.

Say the helper wraps one short expression and that its name and docstring add nothing beyond the expression. Show the inlined expression at the call site in one line and suggest deleting the helper. If two call sites must stay in agreement, such as a sort key and a bisect key, say the helper can stay. Keep it a nit.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines define a function whose whole body is one short expression."
true_what = "A new function whose only statement after an optional docstring returns a literal, a string format, a dict lookup, a string normalization, an `x or None`, a boolean that combines a flag with a call, a query expression with fixed arguments, or one object constructor."
true_not_for = [
  "A key or id format that several call sites must share so they agree, such as a sort key also used by bisect or a document id scheme. A @property on a model. A required interface method. A callback passed by reference.",
]
false_what = "The function has several statements, defines a format that callers share, is a model property, or implements an interface method."
false_not_for = [
  "A one-expression helper with a single caller, even when it carries a long docstring.",
]

