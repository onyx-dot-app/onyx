guidance = '''
Do not hand-write a parser or regex for a standard format such as JSON, Markdown, CSV, URLs, email addresses, subtitle files or ISO timestamps. Use a shared helper or an installed library, and if none fits, add a comment that names what you tried and why it fails.

Ask whether a shared helper or an installed library covers the format, and name one when you find it, such as markdown-it-py, time_str_to_utc in onyx.connectors.cross_connector_utils.miscellaneous_utils, or onyx/utils/streaming_json.py. If none fits, ask for a comment that names what was tried and why it fails.
'''

[scope]
paths = ["backend/**/*.py", "web/src/**/*.ts", "web/src/**/*.tsx"]

[question]
instructions = "The added lines parse a standard text format by scanning characters or applying a hand-written regular expression."
true_what = "New code recognizes or decodes JSON, Markdown, CSV, URLs, email addresses, WebVTT or ISO timestamps by character scanning, string splitting or a hand-written regex, such as datetime.fromisoformat(value.replace(\"Z\", \"+00:00\")) in a connector."
true_not_for = [
  "Formats Onyx defines itself, such as the gateway's provider_id/model_name ids. Building a URL by concatenation. A call to a parsing library or shared helper.",
]
false_what = "The added lines call a library or shared helper, or parse a format that only Onyx defines."
false_not_for = ["A regex that extracts JSON objects or Markdown links from free text."]

