near_misses = [4051744161]
needs_repo_search = false
guidance = '''
Add a one-line comment that gives the reason when you add a fixed sleep, a defensive hasattr check, a global setting on a third-party library, a deliberately skipped case, or a special-case pagination branch.

Ask for a one-line comment that gives the reason, such as the third-party bug, the rate limit, or why the case is skipped. Keep it to one line.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines add a workaround such as a fixed sleep, a defensive hasattr check, a global setting on a third-party library, a deliberately skipped case, or a special-case pagination branch."
true_what = "A time.sleep with a literal, a hasattr check on an object whose type is known, a module-level setting on a third-party library, a branch that skips a case on purpose, or a pagination special case, with no comment that gives the reason."
true_not_for = [
  "Workarounds that carry a one-line comment with the reason. Sleeps inside retry helpers that document their backoff.",
]
false_what = "The workaround has a short comment with its reason."
false_not_for = ["`time.sleep(2)` with no comment."]

