near_misses = [2205916358, 3692751440]
needs_repo_search = false
guidance = '''
Make a parameter required when every real caller passes a value and the function only rejects None or swaps in a default. Type flags as bool with a default. Mark a third-party response field `| None` only where the upstream schema allows it.

Say None has no distinct meaning here. Suggest making the parameter required and validating at the caller, typing the flag as bool with a default, or making the guaranteed response fields required.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines declare a parameter, flag or field as optional when a missing value only leads to an error or a default."
true_what = "A `| None = None` parameter that the body only rejects or replaces with a default, a `bool | None` flag, or a third-party response model whose guaranteed fields are all `| None`."
true_not_for = [
  "API preference models that use `bool | None = None` so the frontend falls back to workspace defaults. Auth dependencies typed `User | None`. Fields the upstream schema allows to be absent.",
]
false_what = "None has a documented distinct meaning, or the upstream schema allows the field to be absent."
false_not_for = ["`def f(x: Foo | None = None)` whose first line raises when x is None."]

