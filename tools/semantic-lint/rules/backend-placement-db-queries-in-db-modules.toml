near_misses = [2985213845, 3319435829]
needs_repo_search = true
repo_search_hint = "Grep backend/onyx/db/<entity>.py and backend/ee/onyx/db/ for an existing function that runs the same query on the same model."
guidance = '''
Put every SQLAlchemy query, including a single `db_session.get(...)`, in a function under a `db/` directory and call that function. Put a query helper for a shared entity (LLM providers, users, groups) in that entity's db module under a feature-neutral name. A feature-local `db/` package counts.

Say that db access belongs in a function under a `db/` module and that this file should call it, so the db abstraction stays in one place. Before naming a new helper, grep the matching onyx/db/<entity>.py module for an existing function on the same model and suggest it. Flag added lines only.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/onyx/**/*.py"]

[question]
instructions = "The added lines run SQLAlchemy query code in a file outside every `db/` directory."
true_what = "The file path has no `/db/` segment and the added lines build select, update or delete statements, or call db_session.query, .execute, .scalar, .scalars or .get with a model class. Also a query helper for a shared entity defined in another feature's db module."
true_not_for = [
  "Files under backend/onyx/db/, backend/ee/onyx/db/, backend/onyx/server/features/build/db/, and backend/onyx/cache/postgres_backend.py. Code that only calls a db helper, passes db_session along, or commits. Alembic migrations. Prometheus metrics collectors, which evan called a gray area.",
]
false_what = "The file is a db module, or the added lines only call helpers imported from a db module."
false_not_for = ["A single `db_session.get(Model, id)` in an API, Celery or feature file."]

