# Generated by mining/write_rules.py from the rule registry draft. Edit by hand after.
title = "Keep BaseModels and dataclasses as plain data"
family = "simplify"
severity = "fix"
sources = [2529160046, 2949247564, 3676483064]
near_misses = [3236928240]
needs_repo_search = false
guidance = '''
Do not give a Pydantic BaseModel or dataclass abstract methods, subclass-overridden behavior or coupled mutable state. Use a normal (abstract) class with an explicit `__init__` for that.

Say BaseModels and dataclasses are for grouping data. Suggest a plain abstract class with an explicit `__init__` when subclasses implement behavior.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines give a Pydantic BaseModel or dataclass behavior methods."
true_what = "A BaseModel or dataclass gains abstract methods, methods that subclasses override, a __post_init__ that enforces a subclass contract, or state that its methods mutate together."
true_not_for = [
  "Field validators, computed properties, model_config, and small pure helpers that format the model's own fields.",
]
false_what = "The class only declares fields, validators and read-only properties."
false_not_for = ["A BaseModel whose subclasses each implement run()."]

