guidance = '''
When a new function or model repeats a neighbouring one and differs only in a status, enum member, flag, retry count, commit call, one id versus many ids, or one or two extra fields, write one implementation that takes that difference as a parameter and have the narrow form call it.

Name the two functions or models and the one value that differs. Suggest one implementation that takes that value as a parameter, with the narrow form calling it, as in "Could `sleep_and_retry` take `retryable_statuses` / `max_retries` params so this becomes a thin wrapper?". For models, suggest one model with the extra field.
'''

[scope]
paths = ["backend/**/*.py"]

[question]
instructions = "The added lines define a function or model that repeats a neighbouring definition with one value changed."
true_what = "A new function whose body copies another function in the diff or its context and differs only in a constant, enum member, flag, retry count, commit call, or one id versus a list of ids. A new model that repeats another model's fields and adds one or two."
true_not_for = [
  "Sibling functions that share factored primitives but differ in their main steps. Models of different entities that share an id field. Required overrides that already delegate to one shared implementation.",
]
false_what = "The two definitions differ in their main steps or describe different entities, or the new one already calls a shared implementation."
false_not_for = [
  "A copy that differs only in one constant, even when its docstring explains why it is kept separate.",
]

