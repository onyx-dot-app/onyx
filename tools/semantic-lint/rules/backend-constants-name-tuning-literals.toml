guidance = '''
Do not write a count limit, size threshold, timeout, batch size or literal list of names inline inside a function. Give it a named constant at the top of the module so it is easy to find and change.

Ask for a named module-level constant at the top of the file so the value is easy to find and change. Do not ask for an env var.
'''

[scope]
paths = ["backend/onyx/**/*.py", "backend/ee/**/*.py", "backend/model_server/**/*.py"]

[question]
instructions = "The added lines write a limit, timeout, batch size or literal list inline inside a function body."
true_what = "A bare number used as a slice bound, a size threshold, a count or timeout keyword argument, a local `batch_size = 500` style assignment, or a list or set of string literals built inside a function."
true_not_for = [
  "Index arithmetic such as 0, 1 and -1 on fixed structures. HTTP status codes. Values already named at module level. Loop counters.",
]
false_what = "The value is a named module-level constant, or the literal is index arithmetic."
false_not_for = ["`run_with_timeout(15, ...)` or `num_chunks=25` inside a function."]

