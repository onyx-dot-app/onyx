# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
version: 1

reviews:
  enabled: true
  sensitivity: medium
  incremental_commits: true
  check_drafts: false

  custom_instructions: |
    Use explicit type annotations for variables to enhance code clarity,
    especially when moving type hints around in the code.

    Use the "Engineering best practices" custom rule as core review context.
    Prefer consistency with existing patterns, fix issues in code you touch,
    avoid tacking new features onto muddy interfaces, fail loudly instead of
    silently swallowing errors, keep code strictly typed, preserve clear state
    boundaries, remove duplicate or dead logic, break up overly long functions,
    avoid hidden import-time side effects, respect module boundaries, and favor
    correctness-by-construction over relying on callers to use an API correctly.

    Do not report again a finding that the author declined with a reason in
    another thread, unless a later change makes that reason false.

    When the PR edits a document (a feature-map component document, a README
    or a code comment), check every edited sentence in this review, not a
    sample. Check absolute words (every, always, never), numbers, and claims
    about a second path (replay, resume, a flag that is off).

    Do not ask for a backward-compatible default, alias or migration for a
    persisted format that no released version wrote. Formats that exist only
    on main or in an open PR need no compatibility code.

    Reference these files for additional context:
    - `CLAUDE.md` — Project instructions and coding standards
    - `.agents/feature-map/PATHS.md`: maps code paths to the feature-map component documents
    - `backend/alembic/README.md` — Migration guidance, including multi-tenant migration behavior
    - `deployment/helm/charts/onyx/values-lite.yaml` — Lite deployment Helm values and service assumptions
    - `deployment/docker_compose/docker-compose.onyx-lite.yml` — Lite deployment Docker Compose overlay and disabled service behavior

  ignore:
    files:
      - greptile.json
      - cubic.yaml
      # Verbatim vendor of github.com/dmmulroy/anti-slop. We do not edit these
      # files, so review findings here belong upstream, not on our PRs.
      - web/tools/oxlint/anti-slop/**

  custom_rules:
    - name: Engineering best practices
      description: >
        Enforce the team's engineering best practices in the attached file.
      file_paths:
        - contributing_guides/best_practices.md

    - name: TODO format
      description: >
        Whenever a TODO is added, there must always be an associated name or
        ticket in the style of TODO(name): ... or TODO(1234): ...

    - name: Frontend standards
      description: >
        For frontend changes, enforce all standards described in the
        web/AGENTS.md file.
      include:
        - web/**
        - desktop/**

    - name: No debugging code
      description: >
        Remove temporary debugging code before merging to production,
        especially tenant-specific debugging logs.

    - name: Feature map stays true
      description: >
        Onyx keeps a feature map in .agents/feature-map/. When a PR changes
        behaviour, find the touched code paths in .agents/feature-map/PATHS.md
        and read the matching component documents. If the PR changes something
        a component document states (an endpoint, permission, env var, default,
        data model field, documented behaviour, or a contract in section 5) and
        does not update that document, flag it and name the stale section. Do
        not flag changes that leave every documented statement true.

    - name: Customer docs fit the reader
      description: >
        For changes under documentation/, check each added or removed
        sentence against "Decide what to include" in
        .agents/skills/docs-writing/SKILL.md. Flag a removal of
        content that the section's Diataxis type needs: on reference
        pages, inputs, outputs, auth, ordering and timing guarantees,
        limits, permissions, defaults, and error behavior; on how-to
        pages, prerequisites, required permissions or scopes, steps,
        and checks; on explanation pages, behavior the reader
        observes, such as freshness, deletion and pruning, permission
        sync, and limits. Flag a removal that is not one of: (a) a
        duplicate the reader still finds at the same point of need,
        (b) wrong per the code, (c) a code-level name (module, table,
        queue) the reader does not configure, (d) a UI restatement on
        an end-user page, (e) multi-tenant or test-only material. Flag
        a removal of every copy of duplicated content. Flag a changed
        product, edition, or plan name (Onyx Cloud, Enterprise
        Edition) unless the code shows the old name is wrong. Flag
        added text that does not serve the page's reader and task,
        that is more detailed than the rest of the page (except
        contract, behavior, or error-recovery content that the
        section's type needs), or that sits away from the point of
        need, and a new section placed above
        more important sections. Flag a new image that shows a cropped
        control or uses a different framing from the other images on
        the page. Name the sentences to cut or restore.
      include:
        - documentation/**

    - name: No hardcoded booleans
      description: >
        When hardcoding a boolean variable to a constant value, remove the
        variable entirely and clean up all places where it's used rather than
        just setting it to a constant.

    - name: Multi-tenant awareness
      description: >
        Code changes must consider both multi-tenant and single-tenant
        deployments. In multi-tenant mode, preserve tenant isolation, ensure
        tenant context is propagated correctly, and avoid assumptions that only
        hold for a single shared schema or globally shared state. In
        single-tenant mode, avoid introducing unnecessary tenant-specific
        requirements or cloud-only control-plane dependencies.

    - name: Onyx lite compatibility
      description: >
        Code changes must consider both regular Onyx deployments and Onyx lite
        deployments. Lite deployments disable the vector DB, Redis, model
        servers, and background workers by default, use PostgreSQL-backed
        cache/auth/file storage, and rely on the API server to handle
        background work. Do not assume those services are available unless the
        code path is explicitly limited to full deployments.

    - name: OnyxError over HTTPException
      description: >
        Never raise HTTPException directly in business code. Use
        `raise OnyxError(OnyxErrorCode.XXX, "message")` from
        `onyx.error_handling.exceptions`. A global FastAPI exception handler
        converts OnyxError into structured JSON responses with
        {"error_code": "...", "detail": "..."}. Error codes are defined in
        `onyx.error_handling.error_codes.OnyxErrorCode`. For upstream errors
        with dynamic HTTP status codes, use `status_code_override`:
        `raise OnyxError(OnyxErrorCode.BAD_GATEWAY, detail, status_code_override=upstream_status)`.
      include:
        - backend/**/*.py

issues:
  fix_with_cubic_buttons: true
  pr_comment_fixes: true
  fix_commits_to_pr: true
